<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Practice Test</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 20px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .btn { padding: 8px 12px; border-radius: 6px; border: 1px solid #333; background: #fff; cursor: pointer; }
    .timer { font-weight: 600; }
    .question { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin: 12px 0; }
    .question h3 { margin: 0 0 6px 0; font-size: 16px; }
    .answers { display: grid; gap: 6px; margin-top: 8px; }
    .answers label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    .explanation { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 8px; margin-top: 8px; }
    .feedback { color: #666; font-size: 13px; margin-left: 24px; }
    .result { margin-top: 16px; font-weight: 600; }
    .sticky { position: sticky; top: 0; background: #fff; padding: 10px 0; }
  </style>
</head>
<body>
  <header class="sticky">
    <nav><a class="btn" href="/">Home</a></nav>
    <div class="title"></div>
    <div class="controls">
      <span class="timer">00:00:00</span>
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn" id="resumeBtn" disabled>Resume</button>
      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="submitBtn">Submit</button>
    </div>
  </header>
  <main id="app"></main>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      const storeKey = (k) => 'pt_' + (slug || 'default') + '_' + k;
      const titleEl = document.querySelector('.title');
      const app = document.getElementById('app');
      const timerEl = document.querySelector('.timer');
      const pauseBtn = document.getElementById('pauseBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      const resetBtn = document.getElementById('resetBtn');
      const submitBtn = document.getElementById('submitBtn');
      let elapsed = parseInt(localStorage.getItem(storeKey('elapsed')) || '0', 10);
      let paused = localStorage.getItem(storeKey('paused')) === '1';
      let interval = null;
      let data = null;
      let answers = JSON.parse(localStorage.getItem(storeKey('answers')) || '{}');
      function fmt(s) {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        const pad = (n) => String(n).padStart(2, '0');
        return pad(h) + ':' + pad(m) + ':' + pad(sec);
      }
      function tick() {
        if (paused) return;
        elapsed += 1;
        timerEl.textContent = fmt(elapsed);
        if (elapsed % 2 === 0) localStorage.setItem(storeKey('elapsed'), String(elapsed));
      }
      function startTimer() {
        if (interval) clearInterval(interval);
        interval = setInterval(tick, 1000);
        timerEl.textContent = fmt(elapsed);
      }
      function setPaused(p) {
        paused = p;
        localStorage.setItem(storeKey('paused'), p ? '1' : '0');
        pauseBtn.disabled = p;
        resumeBtn.disabled = !p;
      }
      pauseBtn.addEventListener('click', () => setPaused(true));
      resumeBtn.addEventListener('click', () => setPaused(false));
      resetBtn.addEventListener('click', () => {
        elapsed = 0; setPaused(false);
        localStorage.removeItem(storeKey('elapsed'));
        timerEl.textContent = fmt(elapsed);
      });
      submitBtn.addEventListener('click', () => {
        if (!data) return;
        let correct = 0;
        data.questions.forEach(q => {
          const sel = answers[q.id] || [];
          const isCorrect = JSON.stringify(sel.sort()) === JSON.stringify((q.correct || []).sort());
          const qEl = document.getElementById('q_' + q.id);
          if (qEl) {
            const res = qEl.querySelector('.result') || document.createElement('div');
            res.className = 'result';
            res.textContent = isCorrect ? 'Correct' : 'Incorrect';
            qEl.appendChild(res);
            const exp = qEl.querySelector('.explanation') || document.createElement('div');
            exp.className = 'explanation';
            exp.innerHTML = '<strong>Explanation:</strong> ' + (q.explanation || '');
            qEl.appendChild(exp);
          }
          if (isCorrect) correct += 1;
        });
        alert('Score: ' + correct + '/' + data.questions.length);
      });
      function render() {
        if (!data) return;
        titleEl.textContent = data.title || 'Practice Test';
        app.innerHTML = '';
        data.questions.forEach((q, idx) => {
          const qEl = document.createElement('div');
          qEl.className = 'question';
          qEl.id = 'q_' + q.id;
          const h = document.createElement('h3');
          h.textContent = (idx + 1) + '. ' + q.question;
          qEl.appendChild(h);
          const type = (q.correct || []).length > 1 ? 'checkbox' : 'radio';
          const name = 'q_' + q.id;
          const selected = answers[q.id] || [];
          const answersEl = document.createElement('div');
          answersEl.className = 'answers';
          (q.answers || []).forEach((opt, i) => {
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = type;
            input.name = name;
            input.value = String.fromCharCode(97 + i); // a,b,c,d...
            input.checked = selected.includes(input.value);
            input.addEventListener('change', () => {
              let cur = answers[q.id] || [];
              if (type === 'radio') {
                cur = [input.value];
              } else {
                if (input.checked) {
                  cur = Array.from(new Set([...cur, input.value]));
                } else {
                  cur = cur.filter(v => v !== input.value);
                }
              }
              answers[q.id] = cur;
              localStorage.setItem(storeKey('answers'), JSON.stringify(answers));
              const fb = label.querySelector('.feedback');
              const choiceIndex = i;
              const ftext = (q.feedbacks && q.feedbacks[choiceIndex]) ? q.feedbacks[choiceIndex] : '';
              if (fb) fb.textContent = ftext;
              else {
                const f = document.createElement('div');
                f.className = 'feedback';
                f.textContent = ftext;
                label.appendChild(f);
              }
            });
            const span = document.createElement('span');
            span.textContent = opt;
            label.appendChild(input);
            label.appendChild(span);
            answersEl.appendChild(label);
          });
          qEl.appendChild(answersEl);
          app.appendChild(qEl);
        });
      }
      async function boot() {
        startTimer(); setPaused(paused);
        if (!slug) {
          app.innerHTML = '<p>Please select a test from the homepage dropdown.</p>';
          return;
        }
        const url = '/data/tests/' + slug + '.json';
        try {
          const res = await fetch(url);
          data = await res.json();
          render();
        } catch (e) {
          app.innerHTML = '<p>Unable to load test data.</p>';
        }
      }
      boot();
    })();
  </script>
</body>
</html>
