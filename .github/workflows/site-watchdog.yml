name: Site Watchdog

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    environment: prod
    env:
      SITE_PUBLIC_URL: ${{ secrets.SITE_PUBLIC_URL }}
      PAYPAL_OWNER_EMAIL: ${{ secrets.PAYPAL_OWNER_EMAIL }} # For smoke test context if needed
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Health Check (Smoke Test)
        if: env.SITE_PUBLIC_URL != ''
        run: |
          if [ -f ./scripts/site-smoke-test.mjs ]; then
            node ./scripts/site-smoke-test.mjs
          else
            echo "scripts/site-smoke-test.mjs not found — skipping"
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Health check failed for ${{ env.SITE_PUBLIC_URL }}"
          # Optional: Send email via SMTP or API if secrets exist
          # if [ -n "${{ secrets.SMTP_HOST }}" ]; then ... fi
          echo "Would send alert to younesdgc@gmail.com"
