name: Owner Crypto Withdraw
on:
  workflow_dispatch:
    inputs:
      amount:
        description: USDT amount to withdraw
        type: number
        required: true
      network:
        description: Network (BEP20=BSC, ERC20=ETH, TRON=TRX)
        type: string
        required: false
        default: BEP20
      address:
        description: Recipient wallet address (must be supplied at dispatch — no hardcoded default)
        type: string
        required: true
      audit_only:
        description: Run validation without submitting withdrawal (probes ALL rails read-only)
        type: boolean
        required: false
        default: false
      rail:
        description: "Settlement rail to use for a live withdrawal"
        type: choice
        required: false
        default: bitget
        options:
          - bitget
          - binance
          - evm

permissions:
  contents: write

concurrency:
  group: owner-crypto-withdraw
  cancel-in-progress: false

jobs:
  withdraw:
    runs-on: ubuntu-latest
    env:
      SWARM_LIVE: "true"
      CRYPTO_NETWORK: ${{ inputs.network }}
      OWNER_CRYPTO_ADDRESS: ${{ inputs.address }}
      TRUST_WALLET_ADDRESS: ${{ inputs.address }}
      TRUST_WALLET_USDT_BEP20: ${{ inputs.address }}
      TRUST_WALLET_USDT_ERC20: ${{ inputs.address }}
      ALLOWED_WITHDRAW_ADDRESSES: ${{ secrets.CRYPTO_ALLOWED_ADDRESSES }}
      WITHDRAW_ENABLE: ${{ secrets.CRYPTO_WITHDRAW_ENABLE || 'false' }}
      # 2026-10-23: rail switched Binance -> Bitget. Binance (HTTP 451) and
      # Bybit (403) geo-block GitHub's US runner egress, so the previous wiring
      # never moved funds (run 49 artifact: binance_withdraw_err_*.json, 451).
      # 2026-10-23 (b): every alternative route now wired, selected by the
      # `rail` dispatch input. bitget = CEX (blocked until the API key is
      # rotated: 40037), binance = CEX (451 from GitHub egress), evm = direct
      # on-chain BSC transfer from the trust wallet — no exchange, therefore
      # immune to exchange geo-blocking, but it needs the wallet private key
      # and BNB gas.
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      TRUST_WALLET_PRIVATE_KEY: ${{ secrets.TRUST_WALLET_PRIVATE_KEY }}
      # I8 capability grant for the non-custodial on-chain rail. Fail-closed:
      # unset secret => the evm send path refuses to sign.
      CAP_SEND_CRYPTO: ${{ secrets.CAP_SEND_CRYPTO || 'false' }}
      # Optional non-US egress (http://user:pass@host:port). Binance answers 451
      # to GitHub's US runner IPs; routing the rail calls through a proxy outside
      # the restricted region is the only way to use that rail from here.
      CRYPTO_EGRESS_PROXY: ${{ secrets.CRYPTO_EGRESS_PROXY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate inputs
        id: validate
        run: |
          set -euo pipefail
          AMOUNT="${{ inputs.amount }}"
          ADDR="${{ inputs.address }}"
          NETWORK="${{ inputs.network }}"
          echo "amount=$AMOUNT"
          echo "network=$NETWORK"
          echo "address=${ADDR:0:6}…${ADDR: -4}"
          # Amount sanity: positive numeric
          if ! awk -v a="$AMOUNT" 'BEGIN { exit !(a+0 > 0) }'; then
            echo "::error::amount must be numeric and > 0"
            exit 1
          fi
          if [ "${#ADDR}" -lt 26 ]; then
            echo "::error::address looks too short"
            exit 1
          fi
          # Live-submission eligibility, computed BEFORE the allowlist gate so the
          # gate can be fail-closed for live runs only (dry-runs stay usable).
          LIVE=false
          if [ "${WITHDRAW_ENABLE}" = "true" ] && [ "${{ inputs.audit_only }}" != "true" ]; then LIVE=true; fi
          echo "live=$LIVE"
          ALLOWED_RAW="${ALLOWED_WITHDRAW_ADDRESSES}"
          if [ -n "$ALLOWED_RAW" ]; then
            MATCH=0
            # EVM addresses are case-insensitive: the EIP-55 casing is a display
            # convention, not part of the identity. The stored allowlist carries
            # "0xA462…A09FEFE7" while the canonical checksum for the same wallet
            # is "0xA462…A09fEfe7", so an exact string compare rejected the very
            # address the on-chain rail requires. Fold case for 0x… only; TRON
            # (base58) and TON addresses stay case-sensitive.
            fold() { case "$1" in 0x*|0X*) printf '%s' "$1" | tr 'A-F' 'a-f';; *) printf '%s' "$1";; esac; }
            ADDR_CMP="$(fold "$ADDR")"
            IFS=',' read -ra PARTS <<< "$ALLOWED_RAW"
            for p in "${PARTS[@]}"; do
              CLEAN="$(echo "$p" | tr -d '[:space:]' | tr -d '\r')"
              if [ "$(fold "$CLEAN")" = "$ADDR_CMP" ]; then MATCH=1; break; fi
            done
            if [ "$MATCH" != "1" ]; then
              echo "::error::address $ADDR is not in CRYPTO_ALLOWED_ADDRESSES"
              exit 1
            fi
            echo "✓ Address allowlisted"
          elif [ "$LIVE" = "true" ]; then
            echo "::error::CRYPTO_ALLOWED_ADDRESSES is not set — FAIL-CLOSED: a live withdrawal may not proceed without an address allowlist."
            exit 1
          else
            echo "::warning::CRYPTO_ALLOWED_ADDRESSES not set — allowlist check skipped (dry-run only; live submission disabled)."
          fi
          if [ "${WITHDRAW_ENABLE}" != "true" ]; then
            echo "::warning::CRYPTO_WITHDRAW_ENABLE != true — will still build payload but skip submission (audit-only semantics)"
            echo "skip_submit=true" >> $GITHUB_OUTPUT
          else
            echo "skip_submit=false" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.audit_only }}" = "true" ]; then
            echo "audit_only=true" >> $GITHUB_OUTPUT
          else
            echo "audit_only=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies (with retries)
        run: |
          set -euo pipefail
          n=0
          until [ $n -ge 3 ]; do
            if npm ci --no-audit --no-fund 2>/dev/null; then break; fi
            n=$((n+1))
            echo "Install retry ($n)..."
            sleep 5
          done
      - name: Execute withdraw (${{ inputs.rail }} rail)
        id: withdraw
        run: |
          set -euo pipefail
          AUDIT="${{ steps.validate.outputs.audit_only }}"
          SKIP="${{ steps.validate.outputs.skip_submit }}"
          RAIL="${{ inputs.rail }}"
          AMOUNT="${{ inputs.amount }}"
          NETWORK="${{ inputs.network }}"
          ADDR="${{ inputs.address }}"
          mkdir -p out/crypto

          # Non-US egress. Node >= 24 can honour HTTP(S)_PROXY for global fetch
          # via --use-env-proxy; without it every rail call egresses from the
          # runner's US IP and Binance answers 451.
          if [ -n "${CRYPTO_EGRESS_PROXY:-}" ]; then
            export HTTP_PROXY="$CRYPTO_EGRESS_PROXY" HTTPS_PROXY="$CRYPTO_EGRESS_PROXY"
            export NODE_OPTIONS="${NODE_OPTIONS:-} --use-env-proxy"
            echo "egress: via configured proxy"
          else
            echo "egress: direct (no CRYPTO_EGRESS_PROXY — Binance will stay 451)"
          fi

          LIVE=false
          if [ "$AUDIT" != "true" ] && [ "$SKIP" != "true" ]; then LIVE=true; fi
          echo "rail=$RAIL live=$LIVE"

          # ---------------------------------------------------------------
          # Audit mode: probe EVERY rail read-only, so one run answers "which
          # routes actually authenticate from GitHub's egress?". Never signs,
          # never withdraws; failures are recorded per rail, not swallowed.
          # ---------------------------------------------------------------
          if [ "$LIVE" != "true" ]; then
            echo "Audit-only / withdraw disabled -> read-only sweep of all rails."
            probe() {
              local name="$1"; shift
              if node "$@" > "out/crypto/rail-audit-$name.json" 2>&1; then
                echo "OK   $name: reachable"
              else
                echo "WARN $name: unreachable/unauthorized (see out/crypto/rail-audit-$name.json)"
              fi
            }
            probe bitget  ./scripts/bitget-rail.mjs --action balance
            probe binance ./scripts/binance-rail.mjs --action balance
            probe evm     ./scripts/evm-wallet-rail.mjs --action balance
            echo "--- sweep summary ---"
            for f in out/crypto/rail-audit-*.json; do
              echo "== $f"; head -c 600 "$f" || true; echo
            done
            exit 0
          fi

          # ---------------------------------------------------------------
          # Live mode: exactly one rail, selected at dispatch. No '|| true':
          # a rail that fails must fail the job (the run 49 false-success bug).
          # ---------------------------------------------------------------
          set +e
          case "$RAIL" in
            bitget)
              node ./scripts/owner-bitget-withdraw.mjs --amount "$AMOUNT" --network "$NETWORK" --execute > out.json 2>&1
              ;;
            binance)
              node ./scripts/binance-rail.mjs --action withdraw --amount "$AMOUNT" --network bsc --confirm > out.json 2>&1
              ;;
            evm)
              CHAIN="bsc"
              if [ "$NETWORK" = "ERC20" ]; then CHAIN="ethereum"; fi
              node ./scripts/evm-wallet-rail.mjs --action send --chain "$CHAIN" --token USDT \
                --amount "$AMOUNT" --to "$ADDR" --confirm > out.json 2>&1
              ;;
            *)
              echo "::error::unknown rail '$RAIL'"
              exit 1
              ;;
          esac
          RC=$?
          set -e
          cat out.json || true
          if [ "$RC" -ne 0 ]; then
            echo "::error::$RAIL rail exited $RC — no funds moved."
            exit "$RC"
          fi
          if grep -q '"fundsMoved": *false' out.json 2>/dev/null; then
            echo "::error::$RAIL reported fundsMoved=false — treat as failure."
            exit 1
          fi
      - name: Upload artifact
        # always(): a failed attempt is the record that matters most for audit —
        # without this the run that proves fail-closed leaves no artifact.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-crypto-withdraw-${{ github.run_id }}
          path: |
            out.json
            out/crypto/
          if-no-files-found: ignore
      - name: Commit out/crypto artifacts if present
        if: steps.validate.outputs.audit_only != 'true'
        run: |
          if [[ -n "$(git status --porcelain out out/crypto 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add out out/crypto 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "owner crypto withdraw executed via workflow dispatch" || true
              git push origin "HEAD:${{ github.ref_name }}"
            else
              echo "No out/crypto artifacts to commit."
            fi
          else
            echo "No out/crypto artifacts to commit."
          fi
