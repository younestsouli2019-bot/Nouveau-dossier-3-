name: Execute Crypto Withdrawal

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Amount in USDT to withdraw'
        required: true
        default: '0'
      network:
        description: 'Blockchain network (ERC20, BEP20, TRX)'
        required: false
        default: 'BEP20'

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute crypto withdrawal
        run: node scripts/execute-crypto-withdraw.mjs --amount ${{ github.event.inputs.amount }}
        env:
          CRYPTO_NETWORK: ${{ github.event.inputs.network }}
          TRUST_WALLET_ADDRESS: ${{ secrets.TRUST_WALLET_ADDRESS }}
          TRUST_WALLET_USDT_ERC20: ${{ secrets.TRUST_WALLET_USDT_ERC20 }}
          TRUST_WALLET_USDT_BEP20: ${{ secrets.TRUST_WALLET_USDT_BEP20 }}
          CRYPTO_OVERRIDE_AMOUNT_USDT: ${{ github.event.inputs.amount }}

      - name: Upload withdrawal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-withdrawal-results
          path: out/crypto/
          retention-days: 30
