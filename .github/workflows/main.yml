name: Download File from URL
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download file
        run: |
          FILENAME="Nouveau-dossier-3-$(date +'%Y-%m-%d').zip"
          curl -fSL -o "$FILENAME" "https://preview-chat-c00bebd6-0736-4444-bdaf-950f1172cd81.space-z.ai/api/download"
          echo "DOWNLOAD_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Debug git state
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          git --version
          git status --porcelain || true
          git remote -v || true
          git config --list

      - name: Commit file (if changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DOWNLOAD_FILENAME" || true
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Downloaded file from URL: $DOWNLOAD_FILENAME"
          echo "no_changes=false" >> $GITHUB_OUTPUT

      - name: Push or create PR (safe)
        if: steps.commit.outputs.no_changes != 'true'
        run: |
          TARGET_BRANCH="${{ github.ref_name || 'main' }}"
          # Try a direct push first
          if git push origin "HEAD:${TARGET_BRANCH}"; then
            echo "Pushed directly to ${TARGET_BRANCH}"
            exit 0
          fi
          echo "Direct push failed; pushing to a new branch and creating a PR"
          NEW_BRANCH="download-$(date +%s)"
          git push origin HEAD:"${NEW_BRANCH}"
          # Create a PR using the GitHub CLI (install if missing)
          if ! command -v gh >/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo apt-get update && sudo apt-get install -y gh
          fi
          gh auth login --with-token <<EOF
${{ secrets.GITHUB_TOKEN }}
EOF
          gh pr create --title "Add downloaded file: $DOWNLOAD_FILENAME" --body "Automated: downloaded file from URL" --base "${TARGET_BRANCH}" --head "${NEW_BRANCH}"
