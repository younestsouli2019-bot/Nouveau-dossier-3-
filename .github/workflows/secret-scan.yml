# Secret-leak gate — 2026-09-06 (external security review, point 20 / BLOCK 8).
# Fails PRs and pushes that introduce detected credentials. Read-only: needs
# no repo write access, and never prints secret VALUES (gitleaks reports
# rule + file + line, values are masked in the SARIF/log summary).
name: Secret Scan (gitleaks)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so leaks in old commits are caught
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
