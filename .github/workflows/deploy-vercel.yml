name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Vercel pull
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Prepare prebuilt output
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          if [ -d rank/output ]; then
            cp -r rank/output/. .vercel/output/static/
          elif [ -d dist ]; then
            cp -r dist/. .vercel/output/static/
          elif [ -d build ]; then
            cp -r build/. .vercel/output/static/
          elif [ -d src ]; then
            cp -r src/* .vercel/output/static/ 2>/dev/null || true
            echo "Note: copied src/ as fallback — may not be a full static build"
          else
            echo "Warning: no static build directory found — deploying empty site"
          fi
          printf '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}\n' > .vercel/output/config.json
      - name: Vercel deploy (prebuilt)
        id: vercel_deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --yes | tail -n1)"
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      - name: Smoke check homepage
        shell: bash
        env:
          URL: ${{ steps.vercel_deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          echo "URL=$URL"
          CODE="$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")"
          if [ "$CODE" != "200" ]; then
            echo "Unexpected HTTP code: $CODE"
            curl -I -L "$URL" || true
            exit 1
          fi
          curl -sSfL "$URL" | head -n 50 >/dev/null
      - name: Output Vercel URL
        run: echo "Vercel deployment completed: ${{ steps.vercel_deploy.outputs.deploy_url }}"
