name: Refresh Scrapes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Refresh dataset
        run: |
          mkdir -p dist_rwc/site-data
          if [ -f ./scripts/refresh-scrapes.mjs ]; then
            node ./scripts/refresh-scrapes.mjs || true
          else
            echo '{"status":"SKIPPED","reason":"refresh-scrapes.mjs not found"}' > dist_rwc/site-data/scrapes.json
          fi
      - name: Commit changes (if any)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "rwc-bot"
            git config user.email "rwc-bot@users.noreply.github.com"
            if [ -f dist_rwc/site-data/scrapes.json ]; then
              git add dist_rwc/site-data/scrapes.json 2>/dev/null || true
            fi
            git add -A
            git commit -m "chore: refresh scrapes dataset" || true
            git push origin HEAD:${{ github.ref_name }}
          fi
