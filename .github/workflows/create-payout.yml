name: Create Payout Batch
on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Payout amount'
        required: true
        type: string
      currency:
        description: 'Currency'
        required: false
        default: 'USD'
        type: string
      payout_method:
        description: 'Payout method (BANK_WIRE, PAYPAL, PAYONEER, WISE, PLAID)'
        required: false
        default: 'BANK_WIRE'
        type: string
      revenue_reference:
        description: 'Real revenue or ledger audit reference'
        required: true
        type: string
      manual_reason:
        description: 'Why this live manual payout is required'
        required: true
        type: string
      recipient_name:
        description: 'Recipient name'
        required: false
        default: 'Younes Tsouli'
        type: string
      recipient_email:
        description: 'Recipient email'
        required: false
        default: 'younestsouli2019@gmail.com'
        type: string

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/create-payout-batch.mjs
        env:
          AMOUNT: ${{ github.event.inputs.amount }}
          CURRENCY: ${{ github.event.inputs.currency }}
          PAYOUT_METHOD: ${{ github.event.inputs.payout_method }}
          REVENUE_REFERENCE: ${{ github.event.inputs.revenue_reference }}
          MANUAL_REASON: ${{ github.event.inputs.manual_reason }}
          RECIPIENT_NAME: ${{ github.event.inputs.recipient_name }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payout-batch
          path: dist_rwc/payout-batch-*.json
