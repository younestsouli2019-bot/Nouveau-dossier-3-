name: API Pipeline Watchdog
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    concurrency:
      group: api-pipeline-watchdog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm ci
      - name: API docs status
        run: |
          if [ -f "./Nouveau dossier (3)/scripts/api-docs-watchdog.mjs" ]; then
            node "./Nouveau dossier (3)/scripts/api-docs-watchdog.mjs" || true
          else
            echo "api-docs-watchdog.mjs not found — skipping"
          fi
      - name: Owner routing validation
        run: |
          mkdir -p dist_rwc/site-data
          if [ -f "./Nouveau dossier (3)/scripts/validate-owner-routing-env.mjs" ]; then
            node "./Nouveau dossier (3)/scripts/validate-owner-routing-env.mjs" > dist_rwc/site-data/owner_routing_check.json || true
          else
            echo "validate-owner-routing-env.mjs not found — skipping"
          fi
      - name: Readiness ping
        run: npm run live:readiness:ping
      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: api pipeline watchdog updates" || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
