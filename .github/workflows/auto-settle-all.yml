name: Auto-Settle All
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 1 — Detect Revenue & Create Payout Batches
        run: node scripts/auto-payout.mjs
        env:
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
          PAYOUT_THRESHOLD: '100'
          PAYOUT_METHOD: BANK_WIRE
          RECIPIENT_NAME: ${{ secrets.OWNER_BENEFICIARY_NAME || 'Younes Tsouli' }}
          RECIPIENT_EMAIL: ${{ secrets.OWNER_PAYPAL_EMAIL || 'younestsouli2019@gmail.com' }}

      - name: Step 2 — Execute Bank Wires via Wise
        run: node scripts/auto-settle-bank-wire.mjs
        env:
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
          SWARM_LIVE: 'true'
          BANK_WIRE_ENABLE: 'true'
          BANK_WIRE_PROVIDER: WISE
          WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
          WISE_PROFILE_ID: ${{ secrets.WISE_PROFILE_ID }}
          WISE_ENVIRONMENT: live
          OWNER_BENEFICIARY_NAME: ${{ secrets.OWNER_BENEFICIARY_NAME }}
          OWNER_IBAN: ${{ secrets.OWNER_IBAN }}
          OWNER_SWIFT: ${{ secrets.OWNER_SWIFT }}
          OWNER_ROUTING_NUMBER: ${{ secrets.OWNER_ROUTING_NUMBER }}
          OWNER_ACCOUNT_NUMBER: ${{ secrets.OWNER_ACCOUNT_NUMBER }}
          OWNER_SORT_CODE: ${{ secrets.OWNER_SORT_CODE }}
          OWNER_BANK_CURRENCY: ${{ secrets.OWNER_BANK_CURRENCY || 'USD' }}
          OWNER_ACCOUNT_TYPE: CHECKING

      - name: Step 3 — Query Final Status
        run: node scripts/query-financial-status.mjs
        env:
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-settle-${{ github.run_id }}
          path: |
            dist_rwc/auto-payout-result.json
            dist_rwc/auto-settle-result.json
            dist_rwc/financial-status.json
