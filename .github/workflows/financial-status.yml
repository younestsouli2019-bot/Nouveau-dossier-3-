name: Financial Status
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      detailed:
        description: 'Show detailed record data'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: financial-status
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/query-financial-status.mjs
        env:
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-status-${{ github.run_id }}
          path: dist_rwc/financial-status.json
