# verify-core — CORE integrity evidence gate (REPORT-ONLY).
#
# Runs scripts/guard/verify-core.ps1 with NO -Init and publishes its full output
# to the job summary + an artifact. It never rewrites the manifest.
#
# Why report-only: the manifest was stale since 0259b36 (2026-08-29). It was
# regenerated under a deliberate [CORE-UPDATE] commit that also reconciled the
# allowlist from 48 to 42 entries — 3 renamed workflows (sync-secrets.yml ->
# sync-secrets.workflow.yml, main.yml -> ci.yml, protect-core.yml ->
# verify-core.yml) and 6 paths that no longer exist (contracts/escrow/**,
# RELEASE_MANIFEST.json, reports/policy/PRECAUTIONS_MATRIX.md).
# Flip it to blocking by deleting the `exit 0` in the "Run verify-core" step.
#
# Read-only: no secrets are referenced (scripts/audit-workflow-secrets.mjs lint
# stays green), no repo writes, contents: read only.
name: Verify Core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run verify-core (read-only, no -Init)
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # verify-core.ps1 ends with `exit <n>` on manifest drift. Running it in
          # this process would tear the step down before the report is written,
          # so spawn a child pwsh and read its exit code. This step always ends
          # with exit 0 (report-only).
          $raw  = @()
          $code = 0
          try {
            $raw  = & pwsh -NoProfile -NonInteractive -File ./scripts/guard/verify-core.ps1 2>&1
            $code = $LASTEXITCODE
          } catch {
            $code = 99
            $raw  = @('verify-core invocation threw: ' + $_.Exception.Message)
          }
          $out = ($raw | Out-String)
          Set-Content -LiteralPath verify-core-output.txt -Value $out -Encoding utf8NoBOM
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('exit_code=' + $code) -Encoding utf8NoBOM
          # Build the markdown from single-quoted fragments. Inside a
          # double-quoted here-string a trailing backtick escapes the newline and
          # swallows the closing terminator, which killed this step at parse time
          # (TerminatorExpectedAtEndOfString) before any output existed.
          $sh = @(
            '## verify-core report (REPORT-ONLY)'
            ''
            ('- exit_code: ' + $code)
            '- manifest: scripts/guard/core-integrity.sha256manifest'
            ''
            '```'
            $out
            '```'
          ) -join "`n"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $sh -Encoding utf8NoBOM
          Write-Host ('verify-core report-only step complete. exit_code=' + $code)
          exit 0

      - name: Annotate result (non-blocking)
        shell: pwsh
        run: |
          $rc = '${{ steps.verify.outputs.exit_code }}'
          if ($rc -ne '0') {
            Write-Host "::warning title=verify-core FAILED::CORE manifest drift detected (report-only, not blocking). See job summary and verify-core-output artifact."
          } else {
            Write-Host "verify-core: PASS"
          }

      - name: Upload verify-core output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verify-core-output-${{ github.run_id }}
          path: verify-core-output.txt
          retention-days: 30
