# verify-core — CORE integrity evidence gate (REPORT-ONLY).
#
# Runs scripts/guard/verify-core.ps1 with NO -Init and publishes its full output
# to the job summary + an artifact. It never rewrites the manifest.
#
# Why report-only: the manifest has been stale since 0259b36 (2026-08-29) and
# 32 of 48 CORE entries mismatch today (pre-existing drift, 4 of them MISS).
# A blocking gate would therefore be red on day one for reasons unrelated to the
# change under review. Flip it to blocking by deleting the `exit 0` in the
# "Run verify-core" step, once the manifest is regenerated under a deliberate
# [CORE-UPDATE] commit.
#
# Read-only: no secrets are referenced (scripts/audit-workflow-secrets.mjs lint
# stays green), no repo writes, contents: read only.
name: Verify Core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run verify-core (read-only, no -Init)
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out  = & ./scripts/guard/verify-core.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Set-Content -LiteralPath verify-core-output.txt -Value $out -Encoding utf8NoBOM
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          @"
          ## verify-core — CORE integrity report (REPORT-ONLY)

          Exit code: ``$code``
          Manifest: ``scripts/guard/core-integrity.sha256manifest``
          Manifest hash frozen at: ``0259b36`` (2026-08-29)

          ```
          $out
          ```
          "@ >> $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Annotate result (non-blocking)
        shell: pwsh
        run: |
          $rc = '${{ steps.verify.outputs.exit_code }}'
          if ($rc -ne '0') {
            Write-Host "::warning title=verify-core FAILED::CORE manifest drift detected (report-only, not blocking). See job summary and verify-core-output artifact."
          } else {
            Write-Host "verify-core: PASS"
          }

      - name: Upload verify-core output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verify-core-output-${{ github.run_id }}
          path: verify-core-output.txt
          retention-days: 30
