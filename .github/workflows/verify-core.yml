# verify-core — CORE integrity gate (BLOCKING).
#
# Runs scripts/guard/verify-core.js with NO -Init and publishes its full output
# to the job summary + an artifact. It never rewrites the manifest.
#
# History: this gate started out report-only because the manifest had been stale
# since 0259b36 (2026-08-29). It was regenerated under a deliberate [CORE-UPDATE]
# commit that also reconciled the allowlist from 48 to 43 entries — 2 renamed
# workflows (sync-secrets.yml -> sync-secrets.workflow.yml, protect-core.yml ->
# verify-core.yml), 7 paths
# that no longer exist and are not to be resurrected (contracts/escrow/**,
# RELEASE_MANIFEST.json, reports/policy/PRECAUTIONS_MATRIX.md, and main.yml,
# which was removed on 2026-09-07 for being an ungated withdrawal trigger), and
# 2 new guard files: scripts/guard/core-files.txt (now the SINGLE source of
# truth for the allowlist) and scripts/guard/sync-core-guards.ps1 (projects it
# into .gitattributes).
# The verifier hashes LF-normalised bytes, so a manifest blessed on Windows
# (core.autocrlf=true) now matches a Linux checkout. Previously it could not.
# This gate is BLOCKING: the "Run verify-core" step propagates the real exit code
# of verify-core.js, so a manifest drift fails the job and blocks the PR. The
# CORE-drift step below is likewise blocking.
#
# Read-only: no secrets are referenced (scripts/audit-workflow-secrets.mjs lint
# stays green), no repo writes, contents: read only.
name: Verify Core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Guard CORE-list drift (BLOCKING)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Fails the job (exit 1) if the generated block in .gitattributes has
          # drifted from the single source of truth scripts/guard/core-files.txt.
          # The allowlist used to live in four files that had to be edited in
          # lock-step; this is the gate that makes silent drift impossible.
          ./scripts/guard/sync-core-guards.ps1 -Check

      - name: Run verify-core (BLOCKING, read-only, no -Init)
        id: verify
        shell: bash
        run: |
          set +e
          node scripts/guard/verify-core.js > verify-core-output.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            printf '## verify-core report\n\n- exit_code: %s\n' "$code"
            printf '%s\n\n' '- manifest: scripts/guard/core-integrity.sha256manifest'
            printf '```\n'
            cat verify-core-output.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verify-core step complete. exit_code=$code"
          exit "$code"

      - name: Test Node verifier
        run: node --test scripts/guard/verify-core.test.mjs

      - name: Annotate result
        if: always()
        shell: pwsh
        run: |
          $rc = '${{ steps.verify.outputs.exit_code }}'
          if ($rc -ne '0') {
            Write-Host "::error title=verify-core FAILED::CORE verification failed or did not run. See job summary and verify-core-output artifact."
          } else {
            Write-Host "verify-core: PASS"
          }

      - name: Upload verify-core output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verify-core-output-${{ github.run_id }}
          path: verify-core-output.txt
          retention-days: 30
