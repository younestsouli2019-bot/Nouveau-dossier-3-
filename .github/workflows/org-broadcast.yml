name: Org Broadcast
on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup gh auth if ORG_PAT present
        env:
          ORG_PAT: ${{ secrets.ORG_PAT }}
        run: |
          if [ -n "${ORG_PAT}" ]; then
            echo "${ORG_PAT}" | gh auth login --with-token
          else
            echo "ORG_PAT missing; broadcast will be skipped."
          fi
      - name: Broadcast repository_dispatch to org repos
        if: ${{ secrets.ORG_PAT != '' && env.GITHUB_ORG != '' }}
        env:
          GITHUB_ORG: ${{ secrets.GITHUB_ORG }}
          GITHUB_REPOS: ${{ secrets.GITHUB_REPOS }}
        run: |
          set -e
          repos="${GITHUB_REPOS}"
          if [ -z "${repos}" ]; then
            repos=$(gh repo list "${GITHUB_ORG}" --json nameWithOwner -q '.[].nameWithOwner')
          fi
          for r in ${repos}; do
            echo "Dispatching to ${r}"
            gh api repos/${r}/dispatches -f event_type=agentic_tick || true
          done
