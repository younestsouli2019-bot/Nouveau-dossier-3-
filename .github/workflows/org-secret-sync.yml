# ───────────────────────────────────────────────────────────────────────────
# ORGANIZATION-WIDE AUTONOMOUS SECRET SYNC
# ───────────────────────────────────────────────────────────────────────────
#
# Directive: "ensure all org repos autonomously sync secrets as they are
# essentially the same throughout."
#
# Approach (operator-approved):
#   - ORG-LEVEL propagation: each shared secret is set ONCE at the ORG level
#     via `gh secret set <KEY> --org <ORG>`. GitHub then automatically makes
#     that secret available to EVERY repo in the org. No per-repo duplication,
#     single source of truth, no secret values in git.
#   - PER-KEY REPO SECRETS (ground truth): every value lives as its own GitHub
#     repo Actions secret (masked, never on the runner filesystem). The
#     workflow reads `secrets.<KEY>` per key and propagates org-wide.
#
# Why not read/write values to disk: values only ever travel through
# environment variables (masked by GitHub). Nothing is committed, echoed, or
# written to a file. This is the anti-leak invariant.
#
# REQUIRED SETUP (one-time, by operator — the workflow cannot create secrets
# without a token with org secret-admin scope):
#   1. Repo VARIABLE  GITHUB_ORG        = the org slug, e.g. younestsouli2019-bot
#   2. Repo VARIABLE  SECRET_SYNC_KEYS  = space-separated list of shared secret
#        KEY NAMES to propagate (names only, never values). Defaults below if
#        unset.
#   3. Repo SECRET    ORG_APP_TOKEN (or ORG_BOT_PAT / ORG_PAT) =
#        fine-grained/org PAT with: org Secrets read+write (set), Actions read.
#        This is the ONLY token the workflow needs to do its job.
#   4. Repo SECRET per key in SECRET_SYNC_KEYS, e.g. BASE44_SERVICE_TOKEN,
#        PAYPAL_CLIENT_SECRET, WISE_API_KEY, ... (masked by GitHub).
#
# SECURITY NOTES:
#   - Least privilege: the org-control tokens themselves (ORG_APP_TOKEN,
#     ORG_BOT_PAT, ORG_PAT, GITHUB_PAT) are NOT auto-propagated by default,
#     so the sync token never leaks across your whole org by accident. To also
#     propagate a value, add its KEY NAME to SECRET_SYNC_KEYS explicitly.
#   - Runs via workflow_dispatch (manual), on push to this file, and on a
#     schedule — autonomous "swarm" keep-in-sync.
#   - `gh secret set --org` is idempotent: running repeatedly converges state.

name: Org Secret Sync (autonomous)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would sync without applying"
        required: false
        default: "false"
  schedule:
    - cron: "17 * * * *"   # hourly, offset from the org-broadcast tick
  push:
    branches: [main]
    paths: ['.github/workflows/org-secret-sync.yml']

concurrency:
  group: org-secret-sync
  cancel-in-progress: false

env:
  # ── Default shared secret set (names only). Operator overrides via the
  #    SECRET_SYNC_KEYS repo variable. These are the runtime/provider secrets
  #    shared across the org's repos. Add/remove names as needed.
  DEFAULT_SYNC_KEYS: |
    BASE44_SERVICE_TOKEN BASE44_API_KEY
    PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET PAYPAL_SECRET PAYPAL_WEBHOOK_ID
    PPP2_CLIENT_ID PPP2_CLIENT_SECRET
    OPENROUTER_API_KEY ZAI_API_KEY
    BITGET_API_KEY BITGET_API_SECRET BITGET_PASSPHRASE
    BYBIT_API_KEY BYBIT_API_SECRET
    BINANCE_API_KEY BINANCE_API_SECRET
    WISE_API_KEY
    PAYONEER_TOKEN PAYONEER_CLIENT_ID PAYONEER_CLIENT_SECRET PAYONEER_PRQ_TOKEN PAYONEER_PROGRAM_ID
    STRIPE_SECRET_KEY
    TRUST_WALLET_PRIVATE_KEY BITGET_WALLET_TON_PRIVATE_KEY OWNER_KEY_BACKUP_SECRET
    MOROCCAN_BANK_RIB OWNER_IBAN OWNER_SWIFT IBAN_BC BIC_BC
    GITHUB_WEBHOOK_SECRET APP_WEBHOOK_URL
    STORAGE_ACCESS_KEY STORAGE_SECRET_KEY
    PLAIDBOX_KEY
    WIRE_SUBMIT_SECRET AUDIT_HMAC_SECRET
    GOOGLE_CLIENT_SECRET

  # ── Pass each shared key's value into env (masked). Values never on disk.
  #    (Only the operator-controlled set below is propagated; each KEY NAME in
  #    SECRET_SYNC_KEYS is read back from the environment by name.)
  BASE44_SERVICE_TOKEN: ${{ secrets.BASE44_SERVICE_TOKEN }}
  BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
  PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
  PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
  PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
  PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
  PPP2_CLIENT_ID: ${{ secrets.PPP2_CLIENT_ID }}
  PPP2_CLIENT_SECRET: ${{ secrets.PPP2_CLIENT_SECRET }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
  BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
  BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
  BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
  BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
  BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
  BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
  BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
  WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
  PAYONEER_TOKEN: ${{ secrets.PAYONEER_TOKEN }}
  PAYONEER_CLIENT_ID: ${{ secrets.PAYONEER_CLIENT_ID }}
  PAYONEER_CLIENT_SECRET: ${{ secrets.PAYONEER_CLIENT_SECRET }}
  PAYONEER_PRQ_TOKEN: ${{ secrets.PAYONEER_PRQ_TOKEN }}
  PAYONEER_PROGRAM_ID: ${{ secrets.PAYONEER_PROGRAM_ID }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  TRUST_WALLET_PRIVATE_KEY: ${{ secrets.TRUST_WALLET_PRIVATE_KEY }}
  BITGET_WALLET_TON_PRIVATE_KEY: ${{ secrets.BITGET_WALLET_TON_PRIVATE_KEY }}
  OWNER_KEY_BACKUP_SECRET: ${{ secrets.OWNER_KEY_BACKUP_SECRET }}
  MOROCCAN_BANK_RIB: ${{ secrets.MOROCCAN_BANK_RIB }}
  OWNER_IBAN: ${{ secrets.OWNER_IBAN }}
  OWNER_SWIFT: ${{ secrets.OWNER_SWIFT }}
  IBAN_BC: ${{ secrets.IBAN_BC }}
  BIC_BC: ${{ secrets.BIC_BC }}
  GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
  APP_WEBHOOK_URL: ${{ secrets.APP_WEBHOOK_URL }}
  STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
  STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
  PLAIDBOX_KEY: ${{ secrets.PLAIDBOX_KEY }}
  WIRE_SUBMIT_SECRET: ${{ secrets.WIRE_SUBMIT_SECRET }}
  AUDIT_HMAC_SECRET: ${{ secrets.AUDIT_HMAC_SECRET }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: ${{ vars.GITHUB_ORG != '' }}
    steps:
      - name: Authenticate gh with org token
        env:
          ORG_TOKEN: ${{ secrets.ORG_APP_TOKEN || secrets.ORG_BOT_PAT || secrets.ORG_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${ORG_TOKEN:-}" ]; then
            echo "${ORG_TOKEN}" | gh auth login --with-token
            echo "gh authenticated for org operations"
          else
            echo "::warning::No ORG_APP_TOKEN / ORG_BOT_PAT / ORG_PAT repo secret. Skipping sync."
          fi

      - name: Determine keys to sync
        id: keys
        env:
          GITHUB_ORG: ${{ vars.GITHUB_ORG }}
          SECRET_SYNC_KEYS: ${{ vars.SECRET_SYNC_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_ORG}" ]; then
            echo "::error::GITHUB_ORG repo variable is empty. Set it to the org slug."
            exit 1
          fi
          # Effective key list = operator SECRET_SYNC_KEYS variable, else default.
          KEYS="${SECRET_SYNC_KEYS}"
          if [ -z "${KEYS}" ]; then
            KEYS="$(printf '%s\n' "${DEFAULT_SYNC_KEYS}" | tr '\n' ' ')"
          fi
          echo "ORG=${GITHUB_ORG}"
          echo "KEY_COUNT=$(echo ${KEYS} | wc -w)"
          echo "KEYS=${KEYS}" >> "$GITHUB_ENV"

      - name: Sync secrets to org level
        env:
          GITHUB_ORG: ${{ vars.GITHUB_ORG }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ORG="${GITHUB_ORG}"
          AUTHED=0
          if gh auth status >/dev/null 2>&1; then AUTHED=1; fi
          if [ "${AUTHED}" != "1" ]; then
            echo "::error::gh not authenticated. Add ORG_APP_TOKEN / ORG_BOT_PAT / ORG_PAT as a repo secret."
            exit 1
          fi
          if [ -z "${KEYS}" ]; then
            echo "::error::No SECRET_SYNC_KEYS resolved."
            exit 1
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::DRY RUN — would propagate the following to org ${ORG}:"
          fi
          SET=0; SKIPPED=0
          for KEY in ${KEYS}; do
            eval "VAL=\${${KEY}:-}"
            if [ -z "${VAL}" ]; then
              echo "::notice::skip ${KEY} (no repo secret value set in this repo)"
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              echo "  would sync: ${KEY}"
              continue
            fi
            printf '%s' "${VAL}" | gh secret set "${KEY}" --org "${ORG}"
            echo "synced: ${KEY}"
            SET=$((SET+1))
          done
          echo "::notice::Org secret sync done. set=${SET} skipped=${SKIPPED} target=${ORG}"

      - name: Log org secret names post-sync (names only)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GITHUB_ORG: ${{ vars.GITHUB_ORG }}
        run: |
          ORG="${GITHUB_ORG}"
          echo "Org secrets present (names only, values masked by GitHub):"
          gh secret list --org "${ORG}" 2>/dev/null | sed 's/\t.*//' || true
