name: Email Automation Agents
on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
jobs:
  send-queued:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TEST_TO: ${{ secrets.SMTP_TEST_TO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "18"
      - name: Generate email queue from payer actions
        run: |
          if [ -f ./scripts/email/queue-from-payer-actions.mjs ]; then
            node ./scripts/email/queue-from-payer-actions.mjs || true
          else
            echo "scripts/email/queue-from-payer-actions.mjs not found — skipping"
          fi
      - name: Add communications payloads to email queue
        run: |
          if [ -f ./scripts/email/queue-from-communications.mjs ]; then
            node ./scripts/email/queue-from-communications.mjs || true
          else
            echo "scripts/email/queue-from-communications.mjs not found — skipping"
          fi
      - name: Escalate unpaid and append to queue
        run: |
          if [ -f ./scripts/email/escalate-unpaid.mjs ]; then
            node ./scripts/email/escalate-unpaid.mjs || true
          else
            echo "scripts/email/escalate-unpaid.mjs not found — skipping"
          fi
      - name: Process email queue
        run: |
          if [ -f ./scripts/email/process-queue.mjs ]; then
            node ./scripts/email/process-queue.mjs || true
          else
            echo "scripts/email/process-queue.mjs not found — skipping"
          fi
