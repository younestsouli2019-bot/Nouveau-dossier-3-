name: Email Automation Agents
on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
jobs:
  send-queued:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TEST_TO: ${{ secrets.SMTP_TEST_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Generate email queue from payer actions
        run: node ./scripts/email/queue-from-payer-actions.mjs
      - name: Add communications payloads to email queue
        run: node ./scripts/email/queue-from-communications.mjs
      - name: Escalate unpaid and append to queue
        run: node ./scripts/email/escalate-unpaid.mjs
      - run: node ./scripts/email/process-queue.mjs
