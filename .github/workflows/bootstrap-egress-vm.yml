name: Bootstrap Egress VM

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: Actions runner version
        required: false
        default: "2.320.0"
      runner_name:
        description: Runner name
        required: false
        default: "egress-runner"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - id: reg
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          OWNER=${GITHUB_REPOSITORY%%/*}
          REPO=${GITHUB_REPOSITORY##*/}
          AUTH="Authorization: Bearer ${GH_TOKEN:-$GITHUB_TOKEN}"
          TOKEN=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${OWNER}/${REPO}/actions/runners/registration-token" | jq -r .token)
          echo "token=${TOKEN}" >> $GITHUB_OUTPUT
      - run: |
          echo "${{ secrets.EGRESS_VM_SSH_KEY }}" > id_rsa
          chmod 600 id_rsa
      - run: |
          scp -o StrictHostKeyChecking=no -i id_rsa scripts_bootstrap-remote.sh ${{ secrets.EGRESS_VM_USER }}@${{ secrets.EGRESS_VM_HOST }}:/tmp/bootstrap.sh
      - env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          GH_RUNNER_REG_TOKEN: ${{ steps.reg.outputs.token }}
          GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUNNER_VERSION: ${{ github.event.inputs.runner_version }}
          RUNNER_NAME: ${{ github.event.inputs.runner_name }}
        run: |
          ssh -o StrictHostKeyChecking=no -i id_rsa ${{ secrets.EGRESS_VM_USER }}@${{ secrets.EGRESS_VM_HOST }} "export TAILSCALE_AUTHKEY='${TAILSCALE_AUTHKEY}'; export GH_RUNNER_REG_TOKEN='${GH_RUNNER_REG_TOKEN}'; export GH_REPO_URL='${GH_REPO_URL}'; export RUNNER_VERSION='${RUNNER_VERSION}'; export RUNNER_NAME='${RUNNER_NAME}'; bash /tmp/bootstrap.sh"
      - run: |
          ssh -o StrictHostKeyChecking=no -i id_rsa ${{ secrets.EGRESS_VM_USER }}@${{ secrets.EGRESS_VM_HOST }} "cat /opt/egress-ip.json" > egress-ip.json
      - uses: actions/upload-artifact@v4
        with:
          name: egress-ip
          path: egress-ip.json
