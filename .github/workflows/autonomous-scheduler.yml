name: Autonomous Scheduler
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write
jobs:
  autonomous-tick:
    runs-on: ubuntu-latest
    concurrency:
      group: autonomous-scheduler
      cancel-in-progress: true
    env:
      BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
      BASE44_SERVICE_TOKEN: ${{ secrets.BASE44_SERVICE_TOKEN }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
      OWNER_WISE_API_TOKEN: ${{ secrets.OWNER_WISE_API_TOKEN }}
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
      OWNER_CRYPTO_BEP20: ${{ secrets.OWNER_CRYPTO_BEP20 }}
      CRYPTO_ALLOWED_ADDRESSES: ${{ secrets.CRYPTO_ALLOWED_ADDRESSES }}
      CRYPTO_WITHDRAW_ENABLE: ${{ secrets.CRYPTO_WITHDRAW_ENABLE }}
      NO_PLATFORM_WALLET: ${{ secrets.NO_PLATFORM_WALLET }}
      AUTONOMOUS_ALLOWED_PAYPAL_RECIPIENTS: ${{ secrets.AUTONOMOUS_ALLOWED_PAYPAL_RECIPIENTS }}
      AUTONOMOUS_ALLOWED_PAYOUT_RECIPIENTS_JSON: ${{ secrets.AUTONOMOUS_ALLOWED_PAYOUT_RECIPIENTS_JSON }}
      OWNER_PAYPAL_EMAIL: ${{ secrets.OWNER_PAYPAL_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Register baseline agents
        run: npm run swarm:add:agents
      - name: Headhunter discovery
        run: npm run swarm:headhunter:once
      - name: Autonomous once
        run: npm run autonomous:once
      - name: Rail health probe
        run: node ./scripts/rail-health-probe.mjs
      - name: Health readiness ping
        run: npm run live:readiness:ping
      - name: Build catalogue (ultimate)
        run: npm run catalogue:ultimate
      - name: Build catalogue (advanced)
        run: npm run catalogue:pdfkit
      - name: Sync catalogue PDF into static artifact
        run: node ./scripts/sync-catalogue-to-static.mjs
      - name: Fallback placeholder if missing
        run: |
          if [ ! -f "catalogue/catalogue_master.pdf" ]; then
            node ./scripts/generate-catalogue-placeholder.mjs
          fi
      - name: Write real-world truth marker
        run: node ./scripts/realworld-truth.mjs
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "autonomous tick: agents, readiness, and state updates"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
