name: Doomsday Vault
on:
  schedule:
    - cron: '0 2 * * *'   # Daily 02:00 UTC
  workflow_dispatch:
    inputs:
      encrypt:
        description: 'Encrypt the snapshot with AES-256-GCM'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      cloud_upload:
        description: 'Upload to configured cloud provider after vault'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  vault:
    name: Create Doomsday Vault Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          path: .runner
      - name: Apply runner overrides
        run: |
          mkdir -p swarm
          cp -r .runner/swarm-overrides/scripts/* swarm/scripts/ 2>/dev/null || true
          cp -r .runner/swarm-overrides/src/* swarm/src/ 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install swarm deps
        working-directory: swarm
        run: |
          if [ -f package.json ]; then npm ci --no-audit --prefer-offline || true; fi
      - name: Create doomsday snapshot
        working-directory: swarm
        run: |
          mkdir -p exports/doomsday
          export DOOMSDAY_ENCRYPT=${{ github.event.inputs.encrypt || 'true' }}
          export DOOMSDAY_PASSPHRASE=${{ secrets.DOOMSDAY_PASSPHRASE || format('doomsday-{0}', github.run_id) }}
          timeout 600 node ./scripts/doomsday-vault.mjs 2>&1 | tee exports/doomsday/vault_log_last.txt
        env:
          BASE44_FLOW_API_URL: https://agent-flow-ai-9855ea98.base44.app/api
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doomsday-snapshot-${{ github.run_id }}
          path: |
            swarm/exports/doomsday/snapshot_*/
            swarm/exports/doomsday/*.zip
            swarm/exports/doomsday/vault_latest.json
            swarm/exports/doomsday/vault_log_last.txt
        retention-days: 30

  upload:
    name: Upload to Secure Cloud
    needs: vault
    if: github.event_name == 'workflow_dispatch' || always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          path: .runner
      - name: Apply runner overrides
        run: |
          mkdir -p swarm
          cp -r .runner/swarm-overrides/scripts/* swarm/scripts/ 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: doomsday-snapshot-${{ github.run_id }}
          path: swarm/exports/doomsday/
        if: github.event_name == 'workflow_dispatch'
      - name: Upload to cloud
        working-directory: swarm
        run: |
          export DOOMSDAY_CLOUD_ENCRYPT=${{ github.event.inputs.encrypt || 'true' }}
          export DOOMSDAY_PASSPHRASE=${{ secrets.DOOMSDAY_PASSPHRASE || format('doomsday-{0}', github.run_id) }}
          timeout 120 node ./scripts/secure-cloud-upload.mjs 2>&1 | tee exports/doomsday/cloud_upload_log_last.txt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOOMSDAY_S3_BUCKET: ${{ secrets.DOOMSDAY_S3_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doomsday-cloud-upload-${{ github.run_id }}
          path: swarm/exports/doomsday/cloud_upload_last.json
          retention-days: 30
