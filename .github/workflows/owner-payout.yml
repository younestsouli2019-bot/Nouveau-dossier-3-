name: Owner Payout
on:
  workflow_dispatch:
    inputs:
      amount:
        description: Amount to send
        type: number
        required: true
      currency:
        description: Currency (e.g., USD)
        type: string
        required: false
        default: USD
      email:
        description: Recipient PayPal email (owner account)
        type: string
        required: false
        default: younestsouli2019@gmail.com
      note:
        description: Reason or note
        type: string
        required: false
        default: Owner payout
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    concurrency:
      group: owner-payout
      cancel-in-progress: false
    env:
      SWARM_LIVE: "true"
      PAYPAL_MODE: "live"
      PAYPAL_API_BASE_URL: "https://api-m.paypal.com"
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      OWNER_PAYPAL_EMAIL: ${{ inputs.email }}
      PAYPAL_PPP2_APPROVED: "true"
      PAYPAL_PPP2_ENABLE_SEND: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Execute payout
        id: payout
        run: |
          node ./Nouveau\ dossier\ (3)/scripts/payout-paypal-once.mjs --amount "${{ inputs.amount }}" --currency "${{ inputs.currency }}" --email "${{ inputs.email }}" --note "${{ inputs.note }}" > out.json
          cat out.json
      - name: Persist artifact
        uses: actions/upload-artifact@v5
        with:
          name: owner-payout-${{ github.run_id }}
          path: out.json
      - name: Commit settlement file if generated
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "owner payout executed via workflow dispatch" || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No settlement files to commit."
