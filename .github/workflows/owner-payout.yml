name: Owner Payout
on:
  workflow_dispatch:
    inputs:
      amount:
        description: Amount to send
        type: number
        required: true
      currency:
        description: Currency (e.g., USD)
        type: string
        required: false
        default: USD
      email:
        description: Recipient PayPal email (owner account)
        type: string
        required: false
        default: younestsouli2019@gmail.com
      note:
        description: Reason or note
        type: string
        required: false
        default: Owner payout

# 2026-09-06 HARDENING (external security review BLOCK 4 + point 17):
#   - permissions minimized to contents: read (artifact upload needs no write)
#   - execute job requires the 'payouts' GitHub environment (human approval;
#     operator must add required reviewers: Settings → Environments → payouts)
#   - automatic commit/push of settlement files REMOVED — results persist as
#     workflow artifacts only; the ledger/repo is never mutated from a runner
#   - Node 22 → 24 (repo standard ahead of GitHub's Node 20 removal)
permissions:
  contents: read

concurrency:
  group: owner-payout
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: owner-payout-guardrails
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      score: ${{ steps.scan.outputs.score }}
      cycle_dedup_ok: ${{ steps.cycle.outputs.ok }}
      safe: ${{ steps.safe.outputs.safe }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install
        run: npm ci || npm install --no-audit --no-fund --no-package-lock
      - name: Lock cannibal cycle-1786593501227 and dedup baseline
        id: cycle
        run: |
          set -euo pipefail
          node ./src/swarm-guardrails.mjs --lock-cycle cycle-1786593501227 || true
          set +e
          OUT=$(node ./src/swarm-guardrails.mjs --scan 2>&1)
          set -e
          echo "--- pre-payout scan ---"
          echo "$OUT"
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Run pattern score scan (FAIL > 15)
        id: scan
        run: |
          set -euo pipefail
          export SWARM_FAIL_SCORE=15
          set +e
          OUT=$(node ./src/swarm-guardrails.mjs --scan 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          SCORE=$(echo "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const o=JSON.parse(s);console.log(o.score?.score ?? "")}catch(e){console.log("")}})')
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then
            echo "::error::Owner payout guardrail scan failed (score=$SCORE, rc=$RC). Payout dispatch halted."
            exit $RC
          fi
      - name: Apply Velocity-Without-Revenue 300s circuit breaker if tripped
        id: vwr
        run: |
          set -euo pipefail
          set +e
          OUT=$(node ./src/swarm-guardrails.mjs --summary 2>&1)
          set -e
          echo "$OUT"
          SCORE=$(echo "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const o=JSON.parse(s);console.log(o.patternScore ?? "")}catch(e){console.log("")}})')
          if [ -n "$SCORE" ] && [ "$SCORE" -gt 30 ]; then
            node ./src/swarm-guardrails.mjs --trip-vwr || true
            echo "::warning::Velocity-Without-Revenue circuit breaker tripped automatically due to score $SCORE"
          fi
      - name: Hydrate context + remediate active signals
        run: |
          set -euo pipefail
          export SWARM_CYCLE_REF=cycle-1786593501227
          node ./src/swarm-guardrails.mjs --hydrate || true
      - name: Safe gate
        id: safe
        run: |
          set -euo pipefail
          SCORE="${{ steps.scan.outputs.score }}"
          SAFE=1
          if [ -z "$SCORE" ]; then SAFE=0; fi
          if [ "$SAFE" = "1" ] && [ "$SCORE" -gt 15 ]; then SAFE=0; fi
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          if [ "$SAFE" = "0" ]; then
            echo "::error::Owner payout dispatch requires pattern score <= 15 (got: $SCORE)."
            exit 1
          fi
          echo "payout gate OK: pattern_score=$SCORE"

  execute:
    needs: guardrails
    runs-on: ubuntu-latest
    environment: payouts
    concurrency:
      group: owner-payout
      cancel-in-progress: false
    env:
      SWARM_LIVE: "true"
      PAYPAL_MODE: "live"
      PAYPAL_API_BASE_URL: "https://api-m.paypal.com"
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      OWNER_PAYPAL_EMAIL: ${{ inputs.email }}
      CAP_WITHDRAW_FIAT: "true"
      SWARM_CYCLE_REF: "cycle-1786593501227"
    steps:
      - name: Fail if guardrails declared unsafe
        if: needs.guardrails.outputs.safe != '1'
        run: |
          echo "::error::guardrails.safe=${{ needs.guardrails.outputs.safe }}. Refusing payout dispatch."
          exit 1
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install
        run: npm ci || npm install --no-audit --no-fund --no-package-lock
      - name: Guardrails re-check (throttle + dedup)
        run: |
          set -euo pipefail
          export SWARM_FAIL_SCORE=15
          node ./src/swarm-guardrails.mjs --scan
      - name: Execute payout
        id: payout
        run: |
          set -euo pipefail
          node ./scripts/payout-paypal-once.mjs --confirm --amount "${{ inputs.amount }}" --currency "${{ inputs.currency }}" --email "${{ inputs.email }}" --note "${{ inputs.note }}" > out.json
          cat out.json
      - name: Persist artifact
        uses: actions/upload-artifact@v5
        with:
          name: owner-payout-${{ github.run_id }}
          path: out.json
      # Auto commit/push of settlement files removed 2026-09-06 (review point
      # 17 / BLOCK 4): the payout result lives in the workflow artifact above;
      # nothing is written back to the repo from a runner.
