name: Live Ops Audit
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run live ops audit
        run: node scripts/audit-live-ops.mjs
        env:
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ops-audit-${{ github.run_id }}
          path: dist_rwc/live-ops-audit.json

