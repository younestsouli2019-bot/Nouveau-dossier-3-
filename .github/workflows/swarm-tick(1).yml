# Swarm Tick — scheduled swarm lifecycle using the BASE44_API_KEY repo secret.
#
# This workflow runs the swarm tick on a schedule. It uses the BASE44_API_KEY
# GitHub Actions secret (set in repo Settings → Secrets and variables → Actions).
#
# When the secret is present, the b44 client runs in "live" mode and hits the
# real Base44 backend. When absent, it auto-falls-back to "offline" mode and
# uses the local file store at db/base44-offline-store.json.
#
# Truth-guard enforcement is IDENTICAL in both modes — every b44.create/update
# passes through enforceTruthGuard() regardless of where the data is persisted.

name: Swarm Tick

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Force mode (live / offline / auto)"
        type: choice
        options:
          - auto
          - live
          - offline
        default: auto
      skip_seed:
        description: "Skip the seed step (assume store is already populated)"
        type: boolean
        default: false

permissions:
  contents: write   # required for committing the offline store back to the repo
  actions: read

concurrency:
  group: swarm-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Always set DATABASE_URL (the dashboard's Prisma client uses it).
      DATABASE_URL: "file:/tmp/audit.db"
      NODE_ENV: production
      OPERATOR_TOKEN: ci-placeholder-token-not-real
      # Mode override (if workflow_dispatch set mode=live|offline).
      BASE44_MODE: ${{ (github.event.inputs.mode == 'live' || github.event.inputs.mode == 'offline') && github.event.inputs.mode || '' }}
      # Pass through the Base44 secret if the repo has it.
      BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Determine backend mode
        id: mode
        run: |
          # If the workflow_dispatch input explicitly set BASE44_MODE, honor it.
          if [ -n "$BASE44_MODE" ]; then
            echo "mode=$BASE44_MODE" >> $GITHUB_OUTPUT
            echo "Forced mode: $BASE44_MODE"
          elif [ -n "$BASE44_API_KEY" ]; then
            echo "mode=live" >> $GITHUB_OUTPUT
            echo "Auto-detected: live (BASE44_API_KEY secret is present)"
          else
            echo "mode=offline" >> $GITHUB_OUTPUT
            echo "Auto-detected: offline (BASE44_API_KEY secret is missing)"
          fi

      - name: Seed offline store (if offline mode and not skipped)
        if: steps.mode.outputs.mode == 'offline' && github.event.inputs.skip_seed != 'true'
        run: npx tsx scripts/seed-offline-store.ts

      - name: Run swarm tick
        id: tick
        run: |
          set -e
          # Hit the POST /api/orchestrator/tick endpoint via a tiny node script.
          # We can't easily start the Next.js server in CI, so we call the
          # orchestrator library directly.
          npx tsx -e "
          import { tick, ensureSeed, invalidateSwarmStateCache, getSwarmState } from './src/lib/orchestrator';
          import { IS_OFFLINE } from './src/lib/base44';

          async function main() {
            console.log('Backend mode:', IS_OFFLINE ? 'OFFLINE' : 'LIVE');
            if (!IS_OFFLINE) {
              try {
                await ensureSeed();
                console.log('Seed step completed (live mode).');
              } catch (e) {
                console.warn('Seed step failed (continuing):', e.message);
              }
            }
            const report = await tick();
            console.log('Tick report:');
            console.log(JSON.stringify(report, null, 2));
            invalidateSwarmStateCache();
            const state = await getSwarmState();
            console.log('Post-tick KPIs:');
            console.log(JSON.stringify(state.kpis, null, 2));
            console.log('backend_status:', state.backend_status);
            if (state.backend_status === 'unreachable') {
              console.error('FAIL: backend unreachable after tick.');
              process.exit(1);
            }
          }
          main().catch(e => { console.error('FATAL:', e); process.exit(1); });
          "

      - name: Run truth-audit
        run: node scripts/dump-truth-audit.mjs

      - name: Run security-audit
        run: node scripts/dump-security-audit.mjs

      - name: Fail if any critical/high finding is OPEN
        env:
          NODE_ENV: production
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('download/security-audit-report.json', 'utf-8'));
          const openCritical = report.findings.filter(f => f.status === 'open' && (f.severity === 'critical' || f.severity === 'high'));
          if (openCritical.length > 0) {
            console.error('FAIL — ' + openCritical.length + ' critical/high findings are OPEN:');
            for (const f of openCritical) {
              console.error('  [' + f.severity.toUpperCase() + '] ' + f.id + ': ' + f.title);
            }
            process.exit(1);
          }
          console.log('PASS — no critical/high findings are OPEN.');
          console.log('Summary:', JSON.stringify(report.summary.by_status, null, 2));
          "

      - name: Commit offline store changes (offline mode only)
        if: steps.mode.outputs.mode == 'offline' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f db/base44-offline-store.json ]; then
            git add db/base44-offline-store.json download/truth-audit-report.json download/truth-audit-report.md download/security-audit-report.json download/security-audit-report.md
            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit -m "chore(swarm-tick): scheduled tick — offline mode

              - Mode: offline (BASE44_API_KEY secret not set in repo)
              - Truth-guard: ENFORCED (0 critical / 0 high open findings)
              - Backend status: reachable (via offline adapter)

              Generated by .github/workflows/swarm-tick.yml"
              git push
            fi
          else
            echo "No offline store file to commit."
          fi

      - name: Upload tick reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-tick-reports-${{ github.run_id }}
          path: |
            download/truth-audit-report.json
            download/truth-audit-report.md
            download/security-audit-report.json
            download/security-audit-report.md
            db/base44-offline-store.json
          retention-days: 30
