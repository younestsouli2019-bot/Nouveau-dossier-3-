name: Revenue Monitor
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Wise + Owner Bank Config
        run: node scripts/validate-wise-owner-config.mjs
        env:
          WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
          WISE_PROFILE_ID: ${{ secrets.WISE_PROFILE_ID }}
          WISE_SOURCE_CURRENCY: ${{ secrets.WISE_SOURCE_CURRENCY || 'USD' }}
          OWNER_BENEFICIARY_NAME: ${{ secrets.OWNER_BENEFICIARY_NAME }}
          OWNER_IBAN: ${{ secrets.OWNER_IBAN }}
          OWNER_SWIFT: ${{ secrets.OWNER_SWIFT }}
          OWNER_SWIFT_BIC: ${{ secrets.OWNER_SWIFT_BIC }}
          OWNER_ROUTING_NUMBER: ${{ secrets.OWNER_ROUTING_NUMBER }}
          OWNER_ACCOUNT_NUMBER: ${{ secrets.OWNER_ACCOUNT_NUMBER }}
          OWNER_SORT_CODE: ${{ secrets.OWNER_SORT_CODE }}
          OWNER_BANK_CURRENCY: ${{ secrets.OWNER_BANK_CURRENCY || 'MAD' }}
          OWNER_BANK_COUNTRY: ${{ secrets.OWNER_BANK_COUNTRY || 'MA' }}

      - name: Detect Revenue & Create Payout Batches
        run: node scripts/ingest-paypal-revenue-events.mjs ; node scripts/auto-payout.mjs
        env:
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_API_BASE_URL: ${{ secrets.PAYPAL_API_BASE_URL || 'https://api-m.paypal.com' }}
          PAYOUT_THRESHOLD: '100'
          PAYOUT_METHOD: BANK_WIRE
          LIVE_ONLY_PAYOUTS: 'true'
          ALLOW_BALANCE_ONLY_PAYOUT: 'false'
          LIVE_REVENUE_LOOKBACK_DAYS: '45'
          RECIPIENT_NAME: ${{ secrets.OWNER_BENEFICIARY_NAME || 'Younes Tsouli' }}
          RECIPIENT_EMAIL: ${{ secrets.OWNER_PAYPAL_EMAIL || 'younestsouli2019@gmail.com' }}

      - name: Execute Pending Bank Wires
        run: node scripts/auto-settle-bank-wire.mjs
        env:
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
          SWARM_LIVE: 'true'
          BANK_WIRE_ENABLE: 'true'
          BANK_WIRE_PROVIDER: WISE
          REQUIRE_LIVE_BATCH_PROVENANCE: 'true'
          WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
          WISE_PROFILE_ID: ${{ secrets.WISE_PROFILE_ID }}
          WISE_ENVIRONMENT: live
          WISE_SOURCE_CURRENCY: ${{ secrets.WISE_SOURCE_CURRENCY || 'USD' }}
          OWNER_BENEFICIARY_NAME: ${{ secrets.OWNER_BENEFICIARY_NAME }}
          OWNER_IBAN: ${{ secrets.OWNER_IBAN }}
          OWNER_SWIFT: ${{ secrets.OWNER_SWIFT }}
          OWNER_SWIFT_BIC: ${{ secrets.OWNER_SWIFT_BIC }}
          OWNER_ROUTING_NUMBER: ${{ secrets.OWNER_ROUTING_NUMBER }}
          OWNER_ACCOUNT_NUMBER: ${{ secrets.OWNER_ACCOUNT_NUMBER }}
          OWNER_SORT_CODE: ${{ secrets.OWNER_SORT_CODE }}
          OWNER_BANK_CURRENCY: ${{ secrets.OWNER_BANK_CURRENCY || 'MAD' }}
          OWNER_BANK_COUNTRY: ${{ secrets.OWNER_BANK_COUNTRY || 'MA' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revenue-monitor-${{ github.run_id }}
          path: |
            dist_rwc/auto-payout-result.json
            dist_rwc/auto-settle-result.json
