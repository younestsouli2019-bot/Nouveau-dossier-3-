# ──────────────────────────────────────────────────────────────────────────
# SYNC SECRETS TO SWARM APP
# ──────────────────────────────────────────────────────────────────────────
#
# OWNER DIRECTIVE (Task 6):
#   Operator pastes real OPENROUTER_API_KEY + ZAI_API_KEY as repo Actions
#   secrets. This workflow reads them + POSTs them (HMAC-signed) to the
#   swarm app's webhook endpoint so the app can activate them and broadcast
#   availability to all agents.
#
# SETUP (one-time, by operator):
#   1. In repo settings → Settings → Secrets and variables → Actions → New secret:
#        OPENROUTER_API_KEY = sk-or-v1-...
#        ZAI_API_KEY        = xxx.yyy
#        APP_WEBHOOK_URL    = https://preview-<bot-id>.space-z.ai/api/webhooks/github-secrets
#        APP_WEBHOOK_SECRET = <random-32-char-string>  (must match GITHUB_WEBHOOK_SECRET in app's .env)
#
#   2. Commit this file to .github/workflows/sync-secrets.yml in the repo.
#
#   3. Make sure the app's .env has:
#        GITHUB_PAT=github_pat_<fine-grained-PAT-with-Actions+Secrets-read-scope>
#        GITHUB_REPO=younestsouli2019-bot/Nouveau-dossier-3-
#        GITHUB_WEBHOOK_SECRET=<same-32-char-string-as-APP_WEBHOOK_SECRET>
#        APP_WEBHOOK_URL=https://preview-<bot-id>.space-z.ai
#
#   4. Test by clicking "Run workflow" in the Actions tab, OR by hitting
#      POST /api/secrets {action: "dispatch_sync"} on the app.
#
# TRIGGERS:
#   - workflow_dispatch         — manual button in the Actions UI
#   - repository_dispatch       — fired by the app via POST /repos/{owner}/{repo}/dispatches
#   - schedule (every 15 min)  — belt-and-suspenders poll (the app also polls)
#   - push to .env-rotation.yml — fires whenever secrets are likely to change
#
# SECURITY:
#   - All secrets are masked in logs (GitHub auto-masks `${{ secrets.* }}`).
#   - HMAC-SHA256 signature on the POST body prevents tampering.
#   - The workflow has minimal permissions (contents: read).
#   - If APP_WEBHOOK_URL is wrong, secrets go nowhere — verify URL carefully.

name: Sync Secrets (Secure)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual sync"
        required: false
        default: "manual"
  repository_dispatch:
    types: [sync-secrets]
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes

permissions:
  contents: read

concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send secrets to app webhook
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          APP_WEBHOOK_URL: ${{ secrets.APP_WEBHOOK_URL }}
          APP_WEBHOOK_SECRET: ${{ secrets.APP_WEBHOOK_SECRET }}
          DISPATCH_REASON: ${{ github.event.client_payload.reason || github.event.inputs.reason || 'schedule' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$APP_WEBHOOK_URL" ] || [ -z "$APP_WEBHOOK_SECRET" ]; then
            echo "::error::APP_WEBHOOK_URL or APP_WEBHOOK_SECRET is empty. Configure them as repo Actions secrets."
            exit 1
          fi

          # Build JSON payload with the actual secret values.
          # jq -n avoids shell interpolation issues + handles escaping.
          TIMESTAMP=$(date +%s)
          PAYLOAD=$(jq -n \
            --arg openrouter "$OPENROUTER_API_KEY" \
            --arg zai "$ZAI_API_KEY" \
            --argjson ts "$TIMESTAMP" \
            --arg run_id "$WORKFLOW_RUN_ID" \
            --arg reason "$DISPATCH_REASON" \
            '{
              secrets: {
                OPENROUTER_API_KEY: $openrouter,
                ZAI_API_KEY: $zai
              },
              timestamp: $ts,
              workflow_run_id: $run_id,
              reason: $reason
            }')

          # Compute HMAC-SHA256 of the raw payload using the shared secret.
          # printf '%s' avoids trailing newline. xxd converts hex bytes → hex string.
          SIGNATURE=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 -hmac "$APP_WEBHOOK_SECRET" -binary \
            | xxd -p -c 256)

          echo "Dispatching to: $APP_WEBHOOK_URL"
          echo "Payload size: $(printf '%s' "$PAYLOAD" | wc -c) bytes"
          echo "Reason: $DISPATCH_REASON"

          # POST to the app's webhook endpoint.
          # --fail makes curl return non-zero on 4xx/5xx so the workflow fails loudly.
          # --silent + --show-error suppresses progress but surfaces errors.
          RESPONSE=$(curl -sS -w "\n%{http_code}" --fail-with-body \
            -X POST "$APP_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" 2>&1) || true

          # Split response body from HTTP status code.
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Webhook delivery failed (HTTP $HTTP_CODE). Body: $BODY"
            exit 1
          fi

          # Check that the response indicates success.
          if ! echo "$BODY" | jq -e '.ok == true' > /dev/null 2>&1; then
            echo "::error::Webhook response did not report ok=true. Body: $BODY"
            exit 1
          fi

          ACTIVATED=$(echo "$BODY" | jq -r '.activated_count // 0')
          TOTAL=$(echo "$BODY" | jq -r '.total_count // 0')
          AVAILABLE=$(echo "$BODY" | jq -r '.snapshot_summary.available_models // 0')

          echo "::notice::Synced $ACTIVATED/$TOTAL secrets. App now has $AVAILABLE available models."
