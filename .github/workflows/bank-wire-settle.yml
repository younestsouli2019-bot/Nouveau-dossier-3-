name: Bank Wire Settlement
on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual transfers)'
        required: false
        default: 'false'
        type: boolean
      max_amount:
        description: 'Max amount per wire (USD)'
        required: false
        default: '5000'
        type: string

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Wise + Owner Bank Config
        run: node scripts/validate-wise-owner-config.mjs
        env:
          WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
          WISE_PROFILE_ID: ${{ secrets.WISE_PROFILE_ID }}
          WISE_SOURCE_CURRENCY: ${{ secrets.WISE_SOURCE_CURRENCY || 'USD' }}
          OWNER_BENEFICIARY_NAME: ${{ secrets.OWNER_BENEFICIARY_NAME }}
          OWNER_IBAN: ${{ secrets.OWNER_IBAN }}
          OWNER_SWIFT: ${{ secrets.OWNER_SWIFT }}
          OWNER_SWIFT_BIC: ${{ secrets.OWNER_SWIFT_BIC }}
          OWNER_ROUTING_NUMBER: ${{ secrets.OWNER_ROUTING_NUMBER }}
          OWNER_ACCOUNT_NUMBER: ${{ secrets.OWNER_ACCOUNT_NUMBER }}
          OWNER_SORT_CODE: ${{ secrets.OWNER_SORT_CODE }}
          OWNER_BANK_CURRENCY: ${{ secrets.OWNER_BANK_CURRENCY || 'MAD' }}
          OWNER_BANK_COUNTRY: ${{ secrets.OWNER_BANK_COUNTRY || 'MA' }}
      - run: node scripts/settle-owner-wise.mjs
        env:
          SWARM_LIVE: 'true'
          BANK_WIRE_ENABLE: 'true'
          BANK_WIRE_PROVIDER: WISE
          WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
          WISE_PROFILE_ID: ${{ secrets.WISE_PROFILE_ID }}
          WISE_ENVIRONMENT: live
          WISE_SOURCE_CURRENCY: ${{ secrets.WISE_SOURCE_CURRENCY || 'USD' }}
          OWNER_BENEFICIARY_NAME: ${{ secrets.OWNER_BENEFICIARY_NAME }}
          OWNER_IBAN: ${{ secrets.OWNER_IBAN }}
          OWNER_SWIFT: ${{ secrets.OWNER_SWIFT }}
          OWNER_SWIFT_BIC: ${{ secrets.OWNER_SWIFT_BIC }}
          OWNER_ROUTING_NUMBER: ${{ secrets.OWNER_ROUTING_NUMBER }}
          OWNER_ACCOUNT_NUMBER: ${{ secrets.OWNER_ACCOUNT_NUMBER }}
          OWNER_SORT_CODE: ${{ secrets.OWNER_SORT_CODE }}
          OWNER_BANK_CURRENCY: ${{ secrets.OWNER_BANK_CURRENCY || 'MAD' }}
          OWNER_BANK_COUNTRY: ${{ secrets.OWNER_BANK_COUNTRY || 'MA' }}
          OWNER_ACCOUNT_TYPE: CHECKING
          WISE_PER_TRANSACTION_LIMIT: ${{ github.event.inputs.max_amount || '5000' }}
      - name: Poll Wise completions
        run: node scripts/poll-wise-bank-wire.mjs
        env:
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
          WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
          WISE_ENVIRONMENT: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wise-settle-${{ github.run_id }}
          path: settlements/wise/wise-settle-*.json
