# Clickless READ-ONLY swarm tick — reconcile + guard + audit.
#
# Runs the real, existing read-only audit/reconcile scripts
# (scripts/swarm-clickless-tick.mjs, scripts/truth-invariant-audit.mjs,
# scripts/url-guard-self-test.mjs) on a schedule. This tick is strictly
# READ-ONLY: it never calls the swarm-ops orchestrator's maybePayout(), never
# funds virtual cards, and never flips a shipment to delivered without a real
# recorded waybill. Money movement gate stays on /api/healthz + operator auth.
#
# DATABASE_URL, when set as a repo secret, enables the read-only DB reconciles;
# absent it, static + SSRF guards still run.

name: Swarm Tick

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # required only if the clickless reports are committed (AUTOCOMMIT_ENABLE)
  actions: read

concurrency:
  group: swarm-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # DATABASE_URL is only wired when the repo has the secret; the clickless
      # tick runner SKIPS DB-backed reconcile/audits when it is unset (so a
      # bare static fight keeps working) and runs them when present.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      OPERATOR_TOKEN: ci-placeholder-token-not-real
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run clickless read-only tick (reconcile + guard + audits)
        id: tick
        continue-on-error: true
        run: |
          set +e
          # READ-ONLY: never calls the swarm-ops orchestrator's maybePayout(),
          # never funds cards, never flips delivered without a real waybill.
          export PLAN_TRANSITION_MODE=1
          export DATABASE_URL="${DATABASE_URL:-}"
          node scripts/swarm-clickless-tick.mjs; RC=$?
          echo "clickless tick rc=$RC"
          exit 0

      - name: Run truth-audit (static, read-only)
        run: node scripts/truth-invariant-audit.mjs

      - name: Run security-audit (static SSRF self-test, read-only)
        run: npx tsx scripts/url-guard-self-test.mjs

      - name: Fail-closed gate — truth invariants + SSRF guard must pass
        env:
          NODE_ENV: production
        run: |
          set -e
          node scripts/truth-invariant-audit.mjs
          echo "truth-invariant-audit: PASS"
          npx tsx scripts/url-guard-self-test.mjs
          echo "url-guard-self-test: PASS (SSRF)"

      - name: Commit clickless tick reports (if autocommit enabled)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "${AUTOCOMMIT_ENABLE:-}" != "true" ]; then
            echo "Autocommit disabled — nothing committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d logs/swarm_clickless ]; then
            git add -A logs/swarm_clickless
            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit -m "chore(swarm-tick): scheduled read-only reconcile + guard + audit

              - Mode: READ-ONLY.clickless (no money moves, no card funding)
              - Truth-guard: ENFORCED (truth-invariant-audit + url-guard-self-test must pass)
              - Backend status: reachable (via orchestrator reconcile)

              Generated by .github/workflows/swarm-tick.yml"
              git push
            fi
          else
            echo "No clickless reports to commit."
          fi

      - name: Upload tick reports as artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: swarm-tick-reports-${{ github.run_id }}
          path: |
            logs/swarm_clickless/
          retention-days: 30
