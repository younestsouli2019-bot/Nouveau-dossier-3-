name: Refresh External Catalogs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install deps (if any)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm i
          else
            echo "No package.json present; skipping install."
          fi

      - name: Refresh ingestion outputs
        env:
          CATALOG_CSV_DIR: ${{ github.workspace }}/rank_mirror
        run: |
          if [ -f ./scripts/ingest-external-catalogs.mjs ]; then
            node ./scripts/ingest-external-catalogs.mjs
          else
            echo "scripts/ingest-external-catalogs.mjs not found — skipping"
          fi
      - name: Refresh scrapes dataset
        run: |
          if [ -f ./scripts/refresh-scrapes.mjs ]; then
            node ./scripts/refresh-scrapes.mjs
          else
            echo "scripts/refresh-scrapes.mjs not found — skipping"
          fi
      - name: Inject Google SSO extension
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
        run: |
          if [ -f ./scripts/inject-google-sso.mjs ]; then
            node ./scripts/inject-google-sso.mjs
          else
            echo "scripts/inject-google-sso.mjs not found — skipping"
          fi

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git add -A
            git commit -m "chore: hourly refresh catalogs, scrapes and SSO injection" || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
