name: Google Admin Provision (Manual)

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Run provisioning scaffold
        env:
          GOOGLE_ADMIN_KEY_BASE64: ${{ secrets.GOOGLE_ADMIN_KEY_BASE64 }}
          GOOGLE_ADMIN_DELEGATED_USER: ${{ secrets.GOOGLE_ADMIN_DELEGATED_USER }}
          GOOGLE_ADMIN_ORG_UNIT: ${{ secrets.GOOGLE_ADMIN_ORG_UNIT }}
        run: |
          if [ -f ./scripts/google-admin-provision.mjs ]; then
            node ./scripts/google-admin-provision.mjs || true
          elif [ -f "./Nouveau dossier (3)/scripts/google-admin-provision.mjs" ]; then
            node "./Nouveau dossier (3)/scripts/google-admin-provision.mjs" || true
          else
            echo "google-admin-provision.mjs not found — skipping"
          fi
