name: OpenCode Autonomous Dev
on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 3am UTC
  workflow_dispatch:
    inputs:
      phase:
        description: 'Run specific phase (all/audit/fix/docs)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - audit
          - fix
          - docs

permissions:
  contents: write

jobs:
  autonomous-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Create plans directory
        run: mkdir -p plans

      - name: Phase 1 — Audit & Plan
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'audit' || github.event.inputs.phase == '' }}
        run: |
          opencode -m "anthropic/claude-sonnet-4-20250514" -p "
          Analyze this bank wire settlement repository. Identify:
          1. Bugs or error-prone code paths
          2. Missing edge cases
          3. Security concerns
          4. Performance improvements
          5. New feature suggestions
          Write findings to plans/audit-$(date +%Y%m%d).json as JSON array with severity levels.
          "
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Phase 2 — Execute Fixes
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'fix' || github.event.inputs.phase == '' }}
        run: |
          opencode -m "openai/gpt-4o" -p "
          Read the latest audit plan from plans/. For critical/high items:
          1. Implement fixes directly
          2. Follow existing code conventions
          3. Verify scripts run with node --check
          Commit each fix individually.
          "
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Phase 3 — Docs & Verify
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'docs' || github.event.inputs.phase == '' }}
        run: |
          opencode -m "openai/gpt-4o-mini" -p "
          Review changes, update documentation, verify pipeline health.
          Do NOT modify settlement logic.
          "
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Push Changes
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == '' }}
        run: |
          git config user.name "opencode-bot"
          git config user.email "bot@opencode.ai"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "autonomous: weekly pipeline audit $(date +%Y-%m-%d)"
            git push origin main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-dev-${{ github.run_id }}
          path: |
            plans/
            /tmp/opencode-phase*.log
