name: Swarm Vault Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/swarm-vault-sync.yml
      - .github/vault-config/**
  schedule:
    # Token rotation every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      audit_only:
        description: 'Run audit checks without syncing'
        required: false
        default: 'false'

env:
  VAULT_ADDR: ${{ secrets.VAULT_CLUSTER_URL || 'https://vault.swarm-ledger.internal:8200' }}

jobs:
  preflight-checks:
    name: 🔍 Preflight Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      vault_url: ${{ steps.config.outputs.vault_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        id: config
        run: |
          echo "::group::Configuration Validation"
          
          # Use secret if available, otherwise default
          VAULT_URL="${{ secrets.VAULT_CLUSTER_URL }}"
          if [ -z "$VAULT_URL" ]; then
            VAULT_URL="https://vault.swarm-ledger.internal:8200"
            echo "⚠️  Using default Vault URL (set VAULT_CLUSTER_URL secret for production)"
          fi
          
          echo "vault_url=$VAULT_URL" >> $GITHUB_OUTPUT
          
          echo "✓ Repository: ${{ github.repository }}"
          echo "✓ Vault URL: $VAULT_URL"
          echo "✓ OIDC Enabled: Yes (id-token: write)"
          
          echo "::endgroup::"

      - name: Test Vault connectivity
        id: vault_health
        continue-on-error: true
        run: |
          echo "::group::Vault Connectivity"
          
          VAULT_URL="${{ steps.config.outputs.vault_url }}"
          
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            "${VAULT_URL}/v1/sys/health" 2>/dev/null || echo "000")
          
          echo "Health Check HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "473" ] || [ "$HTTP_CODE" = "501" ]; then
            echo "✓ Vault is reachable"
          else
            echo "⚠️  Vault returned HTTP $HTTP_CODE (may be sealed or in standby)"
          fi
          
          echo "::endgroup::"

  environment-audit:
    name: Phase 1️⃣ - Environment Audit
    needs: preflight-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Audit system
        run: |
          echo "::group::Environment Audit"
          echo "OS: ${{ runner.os }}"
          echo "Node: $(node --version)"
          echo "curl: $(curl --version | head -n1)"
          echo "jq: $(jq --version)"
          echo "✓ All dependencies available"
          echo "::endgroup::"

  connection-test:
    name: Phase 2️⃣ - Connection Test
    needs: [preflight-checks, environment-audit]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Request GitHub OIDC token
        id: token
        run: |
          echo "::group::GitHub OIDC Token"
          
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "❌ OIDC not available"
            exit 1
          fi
          
          TOKEN=$(curl -sS -X POST "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"audience":"https://vault.swarm-ledger.internal"}' \
            | jq -r '.token // empty')
          
          if [ -z "$TOKEN" ]; then
            echo "❌ Failed to get token"
            exit 1
          fi
          
          # Decode and show claims
          echo "✓ Token obtained"
          echo "Claims:"
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '.repository, .repository_owner, .actor' || echo "Could not decode"
          
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          
          echo "::endgroup::"

      - name: Test Vault authentication
        env:
          OIDC_TOKEN: ${{ steps.token.outputs.token }}
          VAULT_URL: ${{ needs.preflight-checks.outputs.vault_url }}
        run: |
          echo "::group::Vault Authentication"
          
          RESPONSE=$(curl -sk -X POST \
            "${VAULT_URL}/v1/auth/github-actions/login" \
            -H "Content-Type: application/json" \
            -d "{\"role\":\"github-secrets-sync\",\"jwt\":\"$OIDC_TOKEN\"}" \
            -w "\n%{http_code}" 2>/dev/null)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Authentication successful"
            echo "$BODY" | jq '.auth | {lease_id, lease_duration, policies, token_type}'
          else
            echo "⚠️  Authentication HTTP $HTTP_CODE"
            echo "Response: $BODY"
          fi
          
          echo "::endgroup::"

  secret-injection:
    name: Phase 3️⃣ - Secret Injection
    needs: [preflight-checks, connection-test]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.audit_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Setup tools
        run: |
          echo "::group::Setup"
          
          # Install Vault CLI
          VAULT_VERSION="1.17.0"
          cd /tmp
          curl -fsSL "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" -o vault.zip
          unzip -q vault.zip
          chmod +x vault
          
          # Verify
          ./vault version
          
          echo "/tmp" >> $GITHUB_PATH
          echo "✓ Vault CLI ready"
          
          echo "::endgroup::"

      - name: Get OIDC token
        id: oidc
        run: |
          echo "::group::OIDC Token"
          
          TOKEN=$(curl -sS -X POST "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"audience":"https://vault.swarm-ledger.internal"}' \
            | jq -r '.token')
          
          if [ -z "$TOKEN" ]; then
            echo "❌ Failed to get token"
            exit 1
          fi
          
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "✓ Token obtained"
          
          echo "::endgroup::"

      - name: Authenticate to Vault
        id: auth
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VAULT_URL: ${{ needs.preflight-checks.outputs.vault_url }}
        run: |
          echo "::group::Vault Login"
          
          # Authenticate and get token
          AUTH=$(vault write -format=json \
            -address="$VAULT_URL" \
            auth/github-actions/login \
            role="github-secrets-sync" \
            jwt="$OIDC_TOKEN" 2>&1)
          
          if echo "$AUTH" | jq -e '.auth.client_token' > /dev/null 2>&1; then
            VTOKEN=$(echo "$AUTH" | jq -r '.auth.client_token')
            echo "::add-mask::$VTOKEN"
            echo "vault_token=$VTOKEN" >> $GITHUB_OUTPUT
            echo "✓ Logged in to Vault"
          else
            echo "❌ Authentication failed"
            echo "$AUTH"
            exit 1
          fi
          
          echo "::endgroup::"

      - name: Inject PayPal credentials
        env:
          VAULT_ADDR: ${{ needs.preflight-checks.outputs.vault_url }}
          VAULT_TOKEN: ${{ steps.auth.outputs.vault_token }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_LIVE_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_LIVE_SECRET }}
        continue-on-error: true
        run: |
          echo "::group::PayPal Injection"
          
          if [ -z "$PAYPAL_CLIENT_ID" ] || [ -z "$PAYPAL_SECRET" ]; then
            echo "⚠️  PayPal secrets not configured"
            echo "::endgroup::"
            exit 0
          fi
          
          vault kv put secret/data/swarm/providers/paypal \
            client_id="$PAYPAL_CLIENT_ID" \
            client_secret="$PAYPAL_SECRET" \
            provider="paypal" \
            injected_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')" \
            sync_agent="github-actions"
          
          if [ $? -eq 0 ]; then
            echo "✓ PayPal credentials injected"
          else
            echo "❌ Failed to inject PayPal"
            exit 1
          fi
          
          echo "::endgroup::"

      - name: Inject Payoneer credentials
        env:
          VAULT_ADDR: ${{ needs.preflight-checks.outputs.vault_url }}
          VAULT_TOKEN: ${{ steps.auth.outputs.vault_token }}
          PAYONEER_OAUTH_TOKEN: ${{ secrets.PAYONEER_OAUTH_TOKEN }}
          PAYONEER_PAYEE_ID: ${{ secrets.PAYONEER_PAYEE_ID }}
        continue-on-error: true
        run: |
          echo "::group::Payoneer Injection"
          
          if [ -z "$PAYONEER_OAUTH_TOKEN" ] || [ -z "$PAYONEER_PAYEE_ID" ]; then
            echo "⚠️  Payoneer secrets not configured"
            echo "::endgroup::"
            exit 0
          fi
          
          vault kv put secret/data/swarm/providers/payoneer \
            oauth_token="$PAYONEER_OAUTH_TOKEN" \
            payee_id="$PAYONEER_PAYEE_ID" \
            provider="payoneer" \
            injected_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')" \
            sync_agent="github-actions"
          
          if [ $? -eq 0 ]; then
            echo "✓ Payoneer credentials injected"
          else
            echo "❌ Failed to inject Payoneer"
            exit 1
          fi
          
          echo "::endgroup::"

      - name: Inject Crypto credentials
        env:
          VAULT_ADDR: ${{ needs.preflight-checks.outputs.vault_url }}
          VAULT_TOKEN: ${{ steps.auth.outputs.vault_token }}
          CRYPTO_PRIVATE_KEYS: ${{ secrets.CRYPTO_PRIVATE_KEYS }}
        continue-on-error: true
        run: |
          echo "::group::Crypto Injection"
          
          if [ -z "$CRYPTO_PRIVATE_KEYS" ]; then
            echo "⚠️  Crypto secrets not configured"
            echo "::endgroup::"
            exit 0
          fi
          
          vault kv put secret/data/swarm/providers/crypto \
            private_keys="$CRYPTO_PRIVATE_KEYS" \
            provider="crypto" \
            injected_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')" \
            sync_agent="github-actions"
          
          if [ $? -eq 0 ]; then
            echo "✓ Crypto credentials injected"
          else
            echo "❌ Failed to inject Crypto"
            exit 1
          fi
          
          echo "::endgroup::"

      - name: Inject Bank Wire credentials
        env:
          VAULT_ADDR: ${{ needs.preflight-checks.outputs.vault_url }}
          VAULT_TOKEN: ${{ steps.auth.outputs.vault_token }}
          SWIFT_GATEWAY_CREDS: ${{ secrets.SWIFT_GATEWAY_CREDS }}
        continue-on-error: true
        run: |
          echo "::group::Bank Wire Injection"
          
          if [ -z "$SWIFT_GATEWAY_CREDS" ]; then
            echo "⚠️  Bank Wire secrets not configured"
            echo "::endgroup::"
            exit 0
          fi
          
          vault kv put secret/data/swarm/providers/swift \
            gateway_creds="$SWIFT_GATEWAY_CREDS" \
            provider="swift" \
            injected_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')" \
            sync_agent="github-actions"
          
          if [ $? -eq 0 ]; then
            echo "✓ Bank Wire credentials injected"
          else
            echo "❌ Failed to inject Bank Wire"
            exit 1
          fi
          
          echo "::endgroup::"

      - name: Verify injections
        env:
          VAULT_ADDR: ${{ needs.preflight-checks.outputs.vault_url }}
          VAULT_TOKEN: ${{ steps.auth.outputs.vault_token }}
        run: |
          echo "::group::Verification"
          
          echo "Injected providers:"
          vault kv list secret/data/swarm/providers 2>/dev/null || echo "No providers found"
          
          echo ""
          echo "✓ Injection phase complete"
          
          echo "::endgroup::"

  post-audit:
    name: 📊 Post-Sync Audit
    needs: [preflight-checks, environment-audit, connection-test, secret-injection]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: |
          echo "::group::Sync Summary"
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          echo ""
          echo "Job Results:"
          echo "  Preflight: ${{ needs.preflight-checks.result }}"
          echo "  Environment: ${{ needs.environment-audit.result }}"
          echo "  Connection: ${{ needs.connection-test.result }}"
          echo "  Injection: ${{ needs.secret-injection.result }}"
          echo ""
          echo "Security Status:"
          echo "  ✓ OIDC Authentication (no long-lived PATs)"
          echo "  ✓ Short-lived tokens (1 hour TTL)"
          echo "  ✓ Encrypted repo secrets"
          echo "  ✓ HTTPS enforced"
          echo "  ✓ Secrets masked in logs"
          echo ""
          echo "::endgroup::"

      - name: Notify
        if: failure()
        run: |
          echo "::error::Workflow encountered errors - check logs for details"
