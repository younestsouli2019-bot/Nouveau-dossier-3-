name: Supervisor Loop
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: supervisor-loop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run supervisor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE44_FLOW_API_KEY: ${{ secrets.BASE44_FLOW_API_KEY }}
          BASE44_SWARM_API_KEY: ${{ secrets.BASE44_SWARM_API_KEY }}
        run: node scripts/supervisor-loop.mjs
      - name: Commit heartbeat + state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .autonomous-state.json dist_rwc/supervisor-heartbeat.json || true
          git diff --cached --quiet || git commit -m "chore: supervisor loop heartbeat [skip ci]" || true
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supervisor-${{ github.run_id }}
          path: |
            dist_rwc/supervisor-heartbeat.json
            .autonomous-state.json
