name: "Enterprise Multi-Platform Auto-Upgrade & Anti-Regression Pipeline"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  # FAIL-CLOSED / no-fabrication: this pipeline must never mutate the branch.
  # It previously ran with contents: write and auto-committed + auto-pushed
  # model-generated code to `main` (see G5 finding C-6). Patches are now emitted
  # as review artifacts instead.
  contents: read

concurrency:
  group: anti-regression
  cancel-in-progress: false

jobs:
  matrix-platform-check:
    name: "Matrix Audit: ${{ matrix.platform }} (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [aws-lambda, salesforce-apex, workato-recipes, azure-functions]
        environment: [staging, production-mock]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup System Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Core Dependencies
        run: pip install crewai langgraph openai requests pydantic

      - name: Run Anti-Regression Agent
        id: regression-check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLATFORM: ${{ matrix.platform }}
          ENV: ${{ matrix.environment }}
        run: python .github/scripts/anti_regression_agent.py --platform $PLATFORM --env $ENV

      - name: Execute Autonomous Self-Healing & Code Patching
        id: selfheal
        if: failure() && steps.regression-check.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "Regression detected — generating a self-heal patch (REVIEW REQUIRED)."
          python .github/scripts/self_heal_agent.py --platform $PLATFORM
          # Nobody auto-pushes model-generated code to the branch any more:
          # capture the working-tree diff as a reviewable patch artifact.
          git diff > "self-heal-${{ matrix.platform }}.patch" || true
          echo "patch_lines=$(wc -l < "self-heal-${{ matrix.platform }}.patch" || echo 0)"

      - name: Upload self-heal patch (review required)
        if: always() && steps.selfheal.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: self-heal-patch-${{ matrix.platform }}
          path: self-heal-${{ matrix.platform }}.patch
          if-no-files-found: ignore
          retention-days: 14
