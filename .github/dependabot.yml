version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    
    # Automatically bundles multiple vulnerabilities into single PRs to avoid PR noise
    groups:
      axios-dependencies:
        patterns:
          - "axios"
      tar-dependencies:
        patterns:
          - "tar"
      yaml-dependencies:
        patterns:
          - "js-yaml"
