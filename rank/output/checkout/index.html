<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout | Real World Certs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    .box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .row { display: flex; gap: 16px; align-items: center; }
    input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #218838; }
    .muted { color: #666; font-size: 0.9rem; }
  </style>
  <script>
    const catalog = {"APLUS-001": {"title": "CompTIA A+ Complete Course", "price": 129.0}, "NETPLUS-001": {"title": "CompTIA Network+ Course", "price": 139.0}, "SECPLUS-001": {"title": "CompTIA Security+ Course", "price": 149.0}, "AWS-SAA-001": {"title": "AWS Solutions Architect Associate Course", "price": 149.0}, "AWS-DVA-001": {"title": "AWS Developer Associate Course", "price": 149.0}, "GCP-ACE-001": {"title": "Google Associate Cloud Engineer Course", "price": 149.0}, "AZ104-001": {"title": "Azure Administrator AZ-104 Course", "price": 149.0}, "AZ900-001": {"title": "Azure Fundamentals AZ-900 Course", "price": 119.0}, "CCNA-301-001": {"title": "Cisco CCNA 200-301 Course", "price": 139.0}, "TF-ASSOC-001": {"title": "Terraform Associate Course", "price": 139.0}, "CKA-001": {"title": "Certified Kubernetes Administrator Course", "price": 169.0}, "CKAD-001": {"title": "Certified Kubernetes Application Developer Course", "price": 159.0}, "AWS-DOP-001": {"title": "DevOps Professional DOP-C02 Course", "price": 169.0}, "ITIL4F-001": {"title": "ITIL 4 Foundation Course", "price": 129.0}, "PMP-001": {"title": "PMP Exam Prep Course", "price": 179.0}, "SCRUM-SM-001": {"title": "Scrum Master Certification Course", "price": 129.0}, "PRINCE2F-001": {"title": "PRINCE2 Foundation Course", "price": 139.0}, "CEH-12-001": {"title": "CEH v12 Ethical Hacking Course", "price": 189.0}, "CISSP-001": {"title": "CISSP Full Domains Course", "price": 199.0}};
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    function format(n) {
      return '$' + Math.round(n);
    }
    function applyPromo(price, code) {
      if (!code) return price;
      // Basic code: SAVE10 = 10% off
      if (code.toUpperCase() === 'SAVE10') return Math.round(price * 0.9);
      return price;
    }
    function init() {
      const sku = getParam('sku');
      const code = getParam('code');
      const item = catalog[sku];
      if (!item) {
        document.getElementById('details').innerHTML = '<p>Invalid SKU</p>';
        return;
      }
      const base = item.price;
      const total = applyPromo(base, code);
      document.getElementById('course').textContent = item.title;
      document.getElementById('price').textContent = format(base);
      document.getElementById('total').textContent = format(total);
      document.getElementById('sku').textContent = sku;
    }
    function completePurchase() {
      const sku = document.getElementById('sku').textContent;
      const itemName = document.getElementById('course').textContent;
      const totalText = document.getElementById('total').textContent;
      const total = parseFloat(totalText.replace('$',''));
      const email = document.getElementById('email').value;
      const code = new URL(window.location.href).searchParams.get('code') || '';
      if (window.gtag) {
        gtag('event', 'purchase', { value: total, currency: 'USD', items: [{ item_id: sku, item_name: itemName, price: total }] });
      }
      if (window.fbq) {
        fbq('track', 'Purchase', { value: total, currency: 'USD', contents: [{ id: sku, quantity: 1 }] });
      }
      if (window.ttq) {
        ttq.track('CompletePayment', { value: total });
      }
      const ep = '';
      if (ep) {
        const payload = {
          sku: sku,
          title: itemName,
          price: Math.round(total),
          currency: 'USD',
          promo_code: code,
          transaction_id: 'txn_' + Date.now(),
          email: email,
          page: window.location.href,
          source: 'website',
          timestamp: new Date().toISOString()
        };
        fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function(){
          const status = document.getElementById('status');
          status.textContent = 'Payment received. Confirmation sent.';
          status.style.color = '#2d6a4f';
        }).catch(function(){
          const status = document.getElementById('status');
          status.textContent = 'Payment simulated. Thank you!';
          status.style.color = '#2d6a4f';
        });
        return;
      }
      const status = document.getElementById('status');
      status.textContent = 'Payment simulated. Thank you!';
      status.style.color = '#2d6a4f';
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</head>
<body>
  <header>
    <h1>Checkout</h1>
    <p class="muted">Secure checkout • Instant access • 7-day refund</p>
  </header>
  <section class="box" id="details">
    <div class="row">
      <div style="flex:2">
        <h2 id="course"></h2>
        <p>SKU: <span id="sku"></span></p>
        <p>Price: <strong id="price"></strong></p>
        <div class="row" style="margin-top:10px">
          <input id="promo" type="text" placeholder="Promo code (e.g., SAVE10)">
          <button class="btn" onclick="window.location.href='?sku=' + document.getElementById('sku').textContent + '&code=' + document.getElementById('promo').value">Apply</button>
        </div>
      </div>
      <div style="flex:1">
        <h3>Total</h3>
        <p><strong id="total"></strong></p>
        <input id="email" type="email" placeholder="Email for receipt" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; margin-bottom:10px;">
        <button class="btn" onclick="completePurchase()">Complete Purchase</button>
        <p id="status" class="muted" style="margin-top:10px"></p>
      </div>
    </div>
  </section>
</body>
</html>
