name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Vercel pull
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Prepare prebuilt output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          mkdir -p .vercel/output/static

          # Try multiple candidate source locations (repo layout is nested under "Nouveau dossier (3)/")
          SRC=""
          for candidate in "rank/output" "Nouveau dossier (3)/rank/output" "dist" "Nouveau dossier (3)/dist" "public"; do
            if [ -d "$candidate" ] && [ -n "$(ls -A "$candidate" 2>/dev/null)" ]; then
              SRC="$candidate"
              break
            fi
          done

          if [ -n "$SRC" ]; then
            echo "Copying static assets from: $SRC"
            cp -r "$SRC/." .vercel/output/static/
          else
            echo "WARN: no static source directory found; deploying placeholder index.html"
            cat > .vercel/output/static/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>ChariBaaS Autonomous Swarm</title>
            </head>
            <body>
              <h1>ChariBaaS Autonomous Swarm</h1>
              <p>Placeholder deployment — no static source directory was found in the repo.</p>
            </body>
          </html>
          HTML
          fi

          printf '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}\n' > .vercel/output/config.json
      - name: Vercel deploy (prebuilt)
        id: vercel_deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --yes | tail -n1)"
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      - name: Smoke check homepage
        shell: bash
        env:
          URL: ${{ steps.vercel_deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          echo "URL=$URL"
          CODE="$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")"
          if [ "$CODE" != "200" ]; then
            echo "Unexpected HTTP code: $CODE"
            curl -I -L "$URL" || true
            exit 1
          fi
          curl -sSfL "$URL" | head -n 50 >/dev/null
      - name: Output Vercel URL
        run: echo "Vercel deployment completed: ${{ steps.vercel_deploy.outputs.deploy_url }}"
