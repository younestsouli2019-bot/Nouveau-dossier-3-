# Stage this at .github/workflows/shopify-missions.yml to activate.
# Workflow-file writes need a token with `workflow` scope; this copy is inert.
name: Shopify missions (M1 verify, M2 sync)
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Publish to the live store'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
concurrency: shopify-missions
jobs:
  missions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - name: Mission tests (no network)
        run: node scripts/test-shopify-missions.mjs
      - name: M1 verify store
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
        run: node scripts/shopify-verify.mjs
      - name: M2 dry run (always)
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
        run: node scripts/shopify-catalog-sync.mjs
      - name: M2 execute (manual dispatch only)
        if: ${{ inputs.execute == true }}
        env:
          SWARM_LIVE: '1'
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
        run: node scripts/shopify-catalog-sync.mjs --execute
